suite: non-root container identities
templates:
  - templates/scaledjob.yaml
tests:
  - it: sets explicit non-root identities on every container
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      keda.enabled: true
      keda.triggers:
        - type: azure-servicebus
          metadata:
            queueName: test
      database.databaseNames:
        - imports
      initContainer.enabled: true
      initContainer.image: test/init:1
      initContainer.command:
        - sh
        - -c
        - 'true'
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      - equal:
          path: spec.jobTargetRef.template.spec.initContainers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      - equal:
          path: spec.jobTargetRef.template.spec.initContainers[1].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
  - it: supports different non-root identities without losing other security defaults
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      keda.enabled: true
      keda.triggers:
        - type: azure-servicebus
          metadata:
            queueName: test
      database.databaseNames:
        - imports
      initContainer.enabled: true
      initContainer.image: test/init:1
      initContainer.command:
        - sh
        - -c
        - 'true'
      container.securityContext.runAsUser: 2000
      container.securityContext.runAsGroup: 2001
      initContainers.workloadIdentityAdalBridge.securityContext.runAsUser: 3000
      initContainers.workloadIdentityAdalBridge.securityContext.runAsGroup: 3001
      initContainer.securityContext.runAsUser: 4000
      initContainer.securityContext.runAsGroup: 4001
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2001
            allowPrivilegeEscalation: false
      - equal:
          path: spec.jobTargetRef.template.spec.initContainers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 3000
            runAsGroup: 3001
            allowPrivilegeEscalation: false
      - equal:
          path: spec.jobTargetRef.template.spec.initContainers[1].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 4000
            runAsGroup: 4001
            allowPrivilegeEscalation: false
  - it: keeps the main container non-root without a database bridge
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      keda.enabled: true
      keda.triggers:
        - type: azure-servicebus
          metadata:
            queueName: test
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      - notExists:
          path: spec.jobTargetRef.template.spec.initContainers
