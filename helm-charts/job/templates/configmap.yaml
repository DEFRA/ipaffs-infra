apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.service }}
  labels:
    {{- include "ipaffs-common.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "{{ .Values.environment }}"
{{- $database := default (dict) .Values.database }}
{{- $databaseNames := get $database "databaseNames" | default (list) }}
{{- $connectionStringSecretKeys := get $database "connectionStringSecretKey" | default (dict) }}
{{- $connectionStringAliases := get $database "connectionStringAliases" | default (dict) }}
{{- $clientId := include "job.azure.serviceClientId" . | trim }}
{{- range $databaseName := $databaseNames }}
{{- $connectionString := include "job.database.jdbcUrl" (dict "root" $ "databaseName" $databaseName "clientId" $clientId) }}
{{- $defaultConnectionStringSecretKey := printf "DATABASE_DB_CONNECTION_STRING_%s" (upper (snakecase $databaseName)) }}
{{- $connectionStringSecretKey := get $connectionStringSecretKeys $databaseName | default $defaultConnectionStringSecretKey }}
  {{ $connectionStringSecretKey }}: {{ $connectionString | quote }}
{{- range $alias := get $connectionStringAliases $databaseName | default (list) }}
  {{ $alias }}: {{ $connectionString | quote }}
{{- end }}
{{- end }}
{{- range $key, $val := .Values.config }}
  {{ $key }}: "{{ $val }}"
{{- end }}
