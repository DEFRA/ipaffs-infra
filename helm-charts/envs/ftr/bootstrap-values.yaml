# Overlay on DEV bootstrap values. Trade entities are local equivalents for feature testing.
networkPolicy:
  enabled: true

ipaffsConfig:
  data:
    # Remote debugging only in feature namespaces, not the shared DEV namespace.
    # REMOTE_DEBUG is read by the Node frontends' entrypoint scripts; the JVM reads
    # JAVA_TOOL_OPTIONS itself, so it works in the distroless Java images.
    REMOTE_DEBUG: "true"
    JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

serviceBus:
  queues:
    # IPAFFS-owned queues.
    - notify_queue
    - enotification_event_queue
    # Trade-owned queues in DEV; feature namespaces provision isolated equivalents.
    - defra.trade.imports.notifications.create
    - defra.trade.eds.decisionoutput.snd.1002
    - defra.trade.dmp.gto.ipaffsoutput.snd.1002
    - defra.trade.dmp.ipaffsoutput.snd.1002
    - defra.trade.charge.cuc.chargeableevents
  topics:
    - name: notification-topic
    - name: alvs_topic
    - name: messaging_topic
      defaultMessageTimeToLive: P14D
      maxSizeInMegabytes: 5120
      subscriptions:
        - name: commodity_file_upload
          defaultMessageTimeToLive: P14D
          lockDuration: PT30S
          maxDeliveryCount: 3
          deadLetteringOnFilterEvaluationExceptions: true
          correlationFilter:
            properties:
              file_type: commodity_data
              event: "urn:message:IPAFFS.Messages.Events:FileUploaded"
