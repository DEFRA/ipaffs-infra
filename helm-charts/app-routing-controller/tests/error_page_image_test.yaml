suite: error page image
templates:
  - templates/nginx-ingress-error-pages.yaml
tests:
  - it: retains the existing public image by default
    documentIndex: 1
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:alpine
  - it: accepts a registry image pinned by digest
    documentIndex: 1
    set:
      errorPage.image: example.azurecr.io/nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.azurecr.io/nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
