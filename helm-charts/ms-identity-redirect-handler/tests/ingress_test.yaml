suite: redirect handler central certificate
templates:
  - templates/ingress.yaml
tests:
  - it: retains TLS and routing while using the controller default certificate
    set:
      environment: tst
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.tls
          value:
            - hosts: [ipaffs-redirect-tst.azure.defra.cloud]
      - equal:
          path: spec.rules[0].host
          value: ipaffs-redirect-tst.azure.defra.cloud
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: ms-identity-redirect-handler
            port:
              number: 80
