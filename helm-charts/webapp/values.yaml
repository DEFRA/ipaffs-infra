service: ""
project: ipaffs
environment: dev
imageRegistry: ""

container:
  image: ""
  imagePullPolicy: Always
  replicas: 1
  command: ""
  args: []
  securityContext:
    allowPrivilegeEscalation: false

initContainers:
  workloadIdentityAdalBridge:
    securityContext:
      allowPrivilegeEscalation: false

deployment:
  manifestTag: ""

ports:
  service: 80
  container: 8000

livenessProbe:
  httpGet:
    path: /admin/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5

azure:
  clientId: ""
  managedIdentityName: ""

externalSecret:
  enabled: false

redis:
  enabled: false

serviceBus:
  enabled: false
  useSecrets: false

storage:
  accountName: ""

config: {}

database:
  enabled: false
  sqlServerName: ""
  databaseNames: []
  managedDatabaseNames: []
  referencedDatabaseNames: []
  principalName: ""
  legacyManagedIdentityUser: ""
  legacyBaseServiceDbUserAd: ""
  migrations:
    clientId: ""
    managedIdentityName: ""
    enabled: false
    image: ""
    command: ""
    args: []

search:
  enabled: false
  serviceName: ""
  principalName: ""
  subscriptionId: ""
  resourceGroupName: ""

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    #ingress.kubernetes.io/proxy-headers: X-Original-Host
    #ingress.kubernetes.io/custom-request-headers: X-Original-Host:proxy.imp.dev.azure.defra.cloud
    #traefik.ingress.kubernetes.io/router.middlewares: kube-system/original-host
  hosts: []

# Add AGC routes alongside the existing NGINX Ingress; disabled until opted in.
agc:
  enabled: false
  gateway:
    name: ipaffs-agc
    namespace: defra-certs
    sectionName: https
  frontDoorId: ""
  # Empty selects existing FQDN ingress hosts; otherwise supply a subset of them.
  hosts: []
  # Optional whole-request deadline (e.g. 120s), not an NGINX inactivity timeout.
  requestTimeout: ""
  # Service-owned policy can be enabled without a webapp HTTPRoute (e.g. proxy).
  healthCheck:
    enabled: false
    path: /admin/health-check
    host: localhost
    # Zero uses ports.container, since AGC probes the backend pod directly.
    port: 0

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
