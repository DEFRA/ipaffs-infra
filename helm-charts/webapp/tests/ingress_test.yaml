suite: ingress template
templates:
  - templates/ingress.yaml
tests:
  - it: does not render ingress when no hosts are configured
    set:
      service: test-service
      ingress.hosts: []
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the controller default certificate for base and aks hosts
    release:
      namespace: dev
    set:
      service: test-service
      environment: dev
      ingress.hosts[0]: test
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: test
      - equal:
          path: spec.rules[1].host
          value: test.aks.imp.dev.azure.defra.cloud
      - equal:
          path: spec.tls
          value:
            - hosts: [test]
            - hosts: [test.aks.imp.dev.azure.defra.cloud]
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]
          value: "false"

  - it: appends namespace suffix to ingress hosts when namespace differs from environment
    release:
      namespace: feature1
    set:
      service: test-service
      environment: dev
      ingress.hosts[0]: test
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].host
          value: test-feature1
      - equal:
          path: spec.rules[1].host
          value: test-feature1.aks.imp.dev.azure.defra.cloud
      - equal:
          path: spec.tls
          value:
            - hosts: [test-feature1]
            - hosts: [test-feature1.aks.imp.dev.azure.defra.cloud]

  - it: uses ports.service for ingress backend service port
    release:
      namespace: dev
    set:
      service: test-service
      environment: dev
      ingress.hosts[0]: test
      ports.service: 8080
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
