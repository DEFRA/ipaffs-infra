suite: database migrations are independent of Service Bus
templates:
  - templates/database-migration.yaml
tests:
  - it: keeps database configuration without importing the application's Service Bus secret
    release:
      namespace: dev
    set:
      service: notification-service
      database.databaseNames: [notification-microservice]
      database.migrations.enabled: true
      database.migrations.image: test/migrations:1.0.0
      database.migrations.clientId: test-client-id
      serviceBus.enabled: true
      serviceBus.useSecrets: true
      serviceBus.connectionStringAliases: [TRADE_CHARGE_QUEUE_CONNECTION_STRING]
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: ipaffs-config
            - configMapRef:
                name: notification-service
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICE_BUS_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: notification-service-servicebus
                key: SERVICE_BUS_CONNECTION_STRING
                optional: false
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRADE_CHARGE_QUEUE_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: notification-service-servicebus
                key: SERVICE_BUS_CONNECTION_STRING
                optional: false
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_DB_CONNECTION_STRING_NOTIFICATION_MICROSERVICE
            value: "jdbc:sqlserver://devimpdbssq1401.database.windows.net:1433;databaseName=notification-microservice;encrypt=true;socketTimeout=1800000;loginTimeout=15;authentication=ActiveDirectoryManagedIdentity;msiClientId=test-client-id"
