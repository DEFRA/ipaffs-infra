suite: non-root container identities
templates:
  - templates/deployment.yaml
tests:
  - it: keeps the native SQL application non-root without a bridge
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames:
        - imports
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      - notExists:
          path: spec.template.spec.initContainers
  - it: preserves custom application identities and ignores legacy bridge identity settings
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames:
        - imports
      database.workloadIdentity.enabled: false
      container.securityContext.runAsUser: 2000
      container.securityContext.runAsGroup: 2001
      initContainers.workloadIdentityAdalBridge.securityContext.runAsUser: 3000
      initContainers.workloadIdentityAdalBridge.securityContext.runAsGroup: 3001
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - notExists:
          path: spec.template.spec.initContainers
  - it: keeps the main container non-root without a database bridge
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      - notExists:
          path: spec.template.spec.initContainers
