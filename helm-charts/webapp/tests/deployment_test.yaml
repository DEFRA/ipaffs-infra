suite: deployment template
templates:
  - templates/deployment.yaml
tests:
  - it: renders a service account and deployment
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      container.replicas: 3
    asserts:
      - hasDocuments:
          count: 2

  - it: sets managed identity client id on service account
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-service-service
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000001

  - it: uses container.replicas in deployment spec
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      container.replicas: 3
    documentIndex: 1
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 3

  - it: disables privilege escalation on the app container
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: adds manifest tag to deployment metadata only
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      deployment.manifestTag: 18.4.0
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.labels["defra.gov.uk/manifest-tag"]
          value: 18.4.0
      - notExists:
          path: spec.template.metadata.labels["defra.gov.uk/manifest-tag"]

  - it: adds optional secret refs when redis service bus and external secrets are enabled
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      redis.enabled: true
      serviceBus.enabled: true
      serviceBus.useSecrets: true
      externalSecret.enabled: true
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-service-redis
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-service-servicebus
              optional: true
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-service-secrets
              optional: true

  - it: uses ports.container for the http container port
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      ports.container: 4000
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 4000

  - it: sources configuration from the service ConfigMap
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      config.TEST_CONFIG: config-value
    documentIndex: 1
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEST_CONFIG
            value: config-value
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: test-service

  - it: watches the shared ConfigMap without requiring external secrets
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      externalSecret.enabled: false
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["configmap.reloader.stakater.com/reload"]
          value: ipaffs-config
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: ipaffs-config
      - notExists:
          path: spec.template.metadata.annotations["secret.reloader.stakater.com/reload"]

  - it: watches the shared ConfigMap alongside the service secret
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      externalSecret.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["configmap.reloader.stakater.com/reload"]
          value: ipaffs-config
      - equal:
          path: spec.template.metadata.annotations["secret.reloader.stakater.com/reload"]
          value: test-service-secrets

  - it: uses workload identity without an application bridge by default
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames[0]: imports
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: "true"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-service-service

  - it: omits the application bridge when legacy BCP migrations are configured
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.managedDatabaseNames[0]: imports-primary
      database.referencedDatabaseNames[0]: imports-secondary
      database.workloadIdentity.enabled: false
      database.migrations.enabled: true
      database.migrations.runUpload: true
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: "true"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-service-service

  - it: hashes the native application configuration and service identity for rollouts
    release:
      namespace: dev
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames[0]: imports
    documentIndex: 1
    asserts:
      # SHA-256 of the native SQL configuration and the workload identity client ID.
      - equal:
          path: spec.template.metadata.annotations["checksum/service-config"]
          value: c3431c93fc78fa7ed494b1267350937bd37b157f391fdb463fdca332be514783

  - it: keeps the application bridge absent and rollout checksum stable when migration authentication changes
    release:
      namespace: dev
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames[0]: imports
      database.workloadIdentity.enabled: true
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: "true"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-service-service
      # Migration authentication does not change the application's SQL configuration.
      - equal:
          path: spec.template.metadata.annotations["checksum/service-config"]
          value: c3431c93fc78fa7ed494b1267350937bd37b157f391fdb463fdca332be514783

  - it: preserves the service workload identity client id in native mode
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames[0]: imports
      database.workloadIdentity.enabled: true
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000001

  - it: rolls SQL applications when their service identity changes despite a fixed configured client id
    release:
      namespace: dev
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000003
      config.AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames[0]: imports
      database.workloadIdentity.enabled: false
    documentIndex: 1
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/service-config"]
          pattern: "^[a-f0-9]{64}$"
      - notEqual:
          path: spec.template.metadata.annotations["checksum/service-config"]
          value: c3431c93fc78fa7ed494b1267350937bd37b157f391fdb463fdca332be514783

  - it: keeps application rollouts independent of the migrations identity
    release:
      namespace: dev
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      database.databaseNames[0]: imports
      database.migrations.clientId: 00000000-0000-0000-0000-000000000003
      database.workloadIdentity.enabled: false
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/service-config"]
          value: c3431c93fc78fa7ed494b1267350937bd37b157f391fdb463fdca332be514783
