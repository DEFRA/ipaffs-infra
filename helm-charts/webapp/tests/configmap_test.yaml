suite: configmap template
templates:
  - templates/configmap.yaml
tests:
  - it: maps config values into config data
    set:
      service: test-service
      environment: dev
      azure.clientId: 00000000-0000-0000-0000-000000000001
      config.CONFIG_ONLY: config-only-value
    asserts:
      - equal:
          path: data.CONFIG_ONLY
          value: config-only-value
      - notExists:
          path: data.APPLICATIONINSIGHTS_SELF_DIAGNOSTICS_FILE_PATH

  - it: uses native application authentication by default without publishing a client id
    release:
      namespace: dev
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      database.databaseNames[0]: imports
    asserts:
      - equal:
          path: data.DATABASE_DB_CONNECTION_STRING_IMPORTS
          value: "jdbc:sqlserver://devimpdbssq1401.database.windows.net:1433;databaseName=imports;encrypt=true;socketTimeout=1800000;loginTimeout=15;authentication=ActiveDirectoryDefault"
      - notExists:
          path: data.AZURE_CLIENT_ID

  - it: keeps native application authentication when migrations opt in to native mode
    release:
      namespace: dev
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      database.databaseNames[0]: imports
      database.workloadIdentity.enabled: true
    asserts:
      - equal:
          path: data.DATABASE_DB_CONNECTION_STRING_IMPORTS
          value: "jdbc:sqlserver://devimpdbssq1401.database.windows.net:1433;databaseName=imports;encrypt=true;socketTimeout=1800000;loginTimeout=15;authentication=ActiveDirectoryDefault"

  - it: uses native application authentication for managed and referenced databases while migrations remain legacy
    release:
      namespace: sqlwi-pilot
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      database.managedDatabaseNames[0]: imports-primary
      database.referencedDatabaseNames[0]: imports-secondary
      database.workloadIdentity.enabled: false
    asserts:
      - equal:
          path: data.DATABASE_DB_CONNECTION_STRING_IMPORTS_PRIMARY
          value: "jdbc:sqlserver://devimpdbssq1401.database.windows.net:1433;databaseName=imports-primary-sqlwi-pilot;encrypt=true;socketTimeout=1800000;loginTimeout=15;authentication=ActiveDirectoryDefault"
      - equal:
          path: data.DATABASE_DB_CONNECTION_STRING_IMPORTS_SECONDARY
          value: "jdbc:sqlserver://devimpdbssq1401.database.windows.net:1433;databaseName=imports-secondary-sqlwi-pilot;encrypt=true;socketTimeout=1800000;loginTimeout=15;authentication=ActiveDirectoryDefault"

  - it: keeps the existing TST host and database name with legacy migrations
    release:
      namespace: tst
    set:
      service: test-service
      environment: tst
      azure.clientId: 00000000-0000-0000-0000-000000000001
      azure.sqlServerHostname: tstimpdbssqa001.database.windows.net
      database.databaseNames[0]: imports
      database.workloadIdentity.enabled: false
    asserts:
      - equal:
          path: data.DATABASE_DB_CONNECTION_STRING_IMPORTS
          value: "jdbc:sqlserver://tstimpdbssqa001.database.windows.net:1433;databaseName=imports;encrypt=true;socketTimeout=1800000;loginTimeout=15;authentication=ActiveDirectoryDefault"
