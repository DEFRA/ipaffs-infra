suite: application filesystem policy
templates:
  - templates/deployment.yaml
tests:
  - it: enforces an immutable application root with writable temporary storage and agent diagnostics
    template: templates/deployment.yaml
    set:
      service: test-service
      azure.clientId: 00000000-0000-0000-0000-000000000001
      container.image: test/image:1.0.0
      telemetry.java.enabled: false
      externalSecret.enabled: true
      redis.enabled: true
      serviceBus.useSecrets: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: temporary-files
              emptyDir: {}
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: temporary-files
              mountPath: /tmp
              readOnly: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APPLICATIONINSIGHTS_SELF_DIAGNOSTICS_FILE_PATH
            value: /tmp/applicationinsights.log
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-service-secrets
              optional: true
