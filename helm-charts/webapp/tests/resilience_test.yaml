suite: deployment resilience
templates:
  - templates/deployment.yaml
values:
  - ci-values.yaml
tests:
  - it: leaves probes disabled and spreads pods across nodes by default
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: test-service
                  app.kubernetes.io/part-of: ipaffs
      - equal:
          path: spec.replicas
          value: 1

  - it: allows spreading to be disabled with an empty array
    set:
      topologySpreadConstraints: []
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: allows spreading to be disabled when an overlay clears the configuration
    set:
      topologySpreadConstraints: null
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: replaces the default node spreading constraint with a service override
    set:
      service: zone-service
      project: zone-project
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 2
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zone-service
                  app.kubernetes.io/part-of: zone-project

  - it: preserves HTTP readiness and TCP startup probe configuration
    set:
      readinessProbe: &httpReadiness
        httpGet:
          path: /admin/health-check
          port: 8000
          scheme: HTTP
          httpHeaders:
            - name: Host
              value: localhost
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 2
        failureThreshold: 3
      startupProbe: &tcpStartup
        tcpSocket:
          port: 4000
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 60
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value: *httpReadiness
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value: *tcpStartup

  - it: preserves named-port TCP readiness and exec startup probes
    set:
      readinessProbe: &tcpReadiness
        tcpSocket:
          port: http
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 2
      startupProbe: &execStartup
        exec:
          command: [sh, -c, test -f /tmp/started]
        periodSeconds: 3
        failureThreshold: 40
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value: *tcpReadiness
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value: *execStartup

  - it: preserves exec readiness and named-port HTTP startup probes
    set:
      readinessProbe: &execReadiness
        exec:
          command: [sh, -c, test -f /tmp/ready]
        periodSeconds: 5
        successThreshold: 2
      startupProbe: &httpStartup
        httpGet:
          path: /admin/health-check
          port: http
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 30
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value: *execReadiness
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value: *httpStartup

  - it: preserves gRPC probes and the startup termination grace period
    set:
      readinessProbe: &grpcReadiness
        grpc:
          port: 50051
          service: readiness
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
      startupProbe: &grpcStartup
        grpc:
          port: 50051
          service: startup
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 60
        terminationGracePeriodSeconds: 30
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value: *grpcReadiness
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value: *grpcStartup

  - it: spreads the same pods selected by the deployment across nodes and zones
    release:
      name: custom-release
      namespace: custom-namespace
    set:
      service: custom-service
      project: custom-project
      container.replicas: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
    documentIndex: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value: &workloadSelector
            app.kubernetes.io/name: custom-service
            app.kubernetes.io/part-of: custom-project
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              minDomains: 2
              labelSelector:
                matchLabels: *workloadSelector
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels: *workloadSelector

  - it: rejects repeated topology and scheduling policy pairs
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
    asserts:
      - failedTemplate:
          errorMessage: topologySpreadConstraints must not repeat a topologyKey/whenUnsatisfiable pair
