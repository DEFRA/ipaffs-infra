{{- $budget := .Values.podDisruptionBudget | default dict -}}
{{- if $budget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.service }}
  labels:
    {{- include "ipaffs-common.labels" . | nindent 4 }}
spec:
  {{- if hasKey $budget "minAvailable" }}
  minAvailable: {{ $budget.minAvailable | toJson }}
  {{- else if hasKey $budget "maxUnavailable" }}
  maxUnavailable: {{ $budget.maxUnavailable | toJson }}
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  unhealthyPodEvictionPolicy: {{ $budget.unhealthyPodEvictionPolicy | default "AlwaysAllow" }}
  selector:
    matchLabels:
      {{- include "ipaffs-common.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: DoesNotExist
      - key: job-name
        operator: DoesNotExist
{{- end }}
