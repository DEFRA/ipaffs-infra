suite: origin ingress central certificate
templates:
  - templates/ingress.yaml
tests:
  - it: uses the controller default certificate for every origin host
    release:
      namespace: dev
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.tls
          value:
            - hosts: [importnotification-dev.azure.defra.cloud]
            - hosts: [importnotification-int-dev.azure.defra.cloud]
            - hosts: [importnotification-api-dev.azure.defra.cloud]
            - hosts: [importnotification-dev-new.azure.defra.cloud]
            - hosts: [importnotification-int-dev-new.azure.defra.cloud]
            - hosts: [importnotification-api-dev-new.azure.defra.cloud]
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]
          value: "true"

  - it: retains feature origin hosts and an explicit redirect override
    release:
      namespace: feature1
    set:
      originIngress.annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
    asserts:
      - equal:
          path: spec.tls
          value:
            - hosts: [importnotification-dev-feature1.azure.defra.cloud]
            - hosts: [importnotification-int-dev-feature1.azure.defra.cloud]
            - hosts: [importnotification-api-dev-feature1.azure.defra.cloud]
            - hosts: [importnotification-dev-feature1-new.azure.defra.cloud]
            - hosts: [importnotification-int-dev-feature1-new.azure.defra.cloud]
            - hosts: [importnotification-api-dev-feature1-new.azure.defra.cloud]
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]
          value: "false"
