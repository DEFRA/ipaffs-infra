suite: Service Bus Azure entity names
templates:
  - templates/service-bus.yaml
tests:
  - it: preserves queue names with a distinct Kubernetes identity for ASO replacement
    set:
      serviceBus.queues: [enotification_event_queue]
    asserts:
      - equal:
          path: metadata.name
          value: enotification-event-queue-5abf3309
        documentIndex: 1
      - equal:
          path: spec.azureName
          value: enotification_event_queue
        documentIndex: 1

  - it: preserves Azure names for the supported string topic form
    set:
      serviceBus.topics: [alvs_topic, notification-topic]
    asserts:
      - equal:
          path: metadata.name
          value: alvs-topic-f12fca5c
        documentIndex: 1
      - equal:
          path: spec.azureName
          value: alvs_topic
        documentIndex: 1
      - equal:
          path: metadata.name
          value: notification-topic
        documentIndex: 2
      - equal:
          path: spec.azureName
          value: notification-topic
        documentIndex: 2

  - it: references the normalized topic resource while preserving subscription names in Azure
    set:
      serviceBus.topics:
        - name: messaging_topic
          subscriptions: [commodity_file_upload]
    asserts:
      - equal:
          path: metadata.name
          value: messaging-topic-fd90158d
        documentIndex: 1
      - equal:
          path: spec.azureName
          value: messaging_topic
        documentIndex: 1
      - equal:
          path: metadata.name
          value: commodity-file-upload-1a55a9fa
        documentIndex: 2
      - equal:
          path: spec.azureName
          value: commodity_file_upload
        documentIndex: 2
      - equal:
          path: spec.owner.name
          value: messaging-topic-fd90158d
        documentIndex: 2

  - it: renders a subscription without a rule when no correlation filter is set
    set:
      serviceBus.topics:
        - name: messaging-topic
          subscriptions:
            - commodity-file-upload
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: NamespacesTopicsSubscription
        documentIndex: 2
      - equal:
          path: metadata.name
          value: commodity-file-upload
        documentIndex: 2

  - it: renders the correlation filter as a named rule
    set:
      serviceBus.topics:
        - name: messaging-topic
          subscriptions:
            - name: commodity_file_upload
              correlationFilter:
                label: commodity-file-upload
                properties:
                  EntityType: commodity
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: NamespacesTopicsSubscription
        documentIndex: 2
      - equal:
          path: metadata.name
          value: commodity-file-upload-1a55a9fa
        documentIndex: 2
      - equal:
          path: spec.azureName
          value: commodity_file_upload
        documentIndex: 2
      - isKind:
          of: NamespacesTopicsSubscriptionsRule
        documentIndex: 3
      - equal:
          path: metadata.name
          value: messaging-topic-commodity-file-upload-1a55a9fa-correlation-filter
        documentIndex: 3
      - equal:
          path: spec.azureName
          value: correlation_filter
        documentIndex: 3
      - equal:
          path: spec.owner.name
          value: commodity-file-upload-1a55a9fa
        documentIndex: 3
      - equal:
          path: spec.filterType
          value: CorrelationFilter
        documentIndex: 3
      - equal:
          path: spec.correlationFilter
          value:
            label: commodity-file-upload
            properties:
              EntityType: commodity
        documentIndex: 3

  - it: rejects an empty correlation filter
    set:
      serviceBus.topics:
        - name: messaging-topic
          subscriptions:
            - name: commodity_file_upload
              correlationFilter: {}
    asserts:
      - failedTemplate: {}

  - it: renders the DEV messaging topic to match the SND reference
    release:
      namespace: dev
    values:
      - ../../envs/dev/bootstrap-values.yaml
    asserts:
      - equal:
          path: spec
          value:
            azureName: messaging_topic
            owner:
              name: devimpinfsb1401-dev
            defaultMessageTimeToLive: P14D
            maxSizeInMegabytes: 5120
        documentSelector:
          path: metadata.name
          value: messaging-topic-fd90158d
      - equal:
          path: spec
          value:
            azureName: commodity_file_upload
            owner:
              name: messaging-topic-fd90158d
            defaultMessageTimeToLive: P14D
            lockDuration: PT30S
            maxDeliveryCount: 3
            deadLetteringOnFilterEvaluationExceptions: true
        documentSelector:
          path: metadata.name
          value: commodity-file-upload-1a55a9fa
      - equal:
          path: spec
          value:
            azureName: correlation_filter
            owner:
              name: commodity-file-upload-1a55a9fa
            filterType: CorrelationFilter
            correlationFilter:
              properties:
                file_type: commodity_data
                event: urn:message:IPAFFS.Messages.Events:FileUploaded
        documentSelector:
          path: metadata.name
          value: messaging-topic-fd90158d-commodity-file-upload-1a55a9fa-correlation-filter

  - it: renders the FTR overlay messaging topic to match DEV
    release:
      namespace: ftr-feature-42
    values:
      - ../../envs/dev/bootstrap-values.yaml
      - ../../envs/ftr/bootstrap-values.yaml
    asserts:
      - equal:
          path: spec
          value:
            azureName: messaging_topic
            owner:
              name: devimpinfsb1401-ftr-feature-42
            defaultMessageTimeToLive: P14D
            maxSizeInMegabytes: 5120
        documentSelector:
          path: metadata.name
          value: messaging-topic-fd90158d
      - equal:
          path: spec
          value:
            azureName: commodity_file_upload
            owner:
              name: messaging-topic-fd90158d
            defaultMessageTimeToLive: P14D
            lockDuration: PT30S
            maxDeliveryCount: 3
            deadLetteringOnFilterEvaluationExceptions: true
        documentSelector:
          path: metadata.name
          value: commodity-file-upload-1a55a9fa
      - equal:
          path: spec
          value:
            azureName: correlation_filter
            owner:
              name: commodity-file-upload-1a55a9fa
            filterType: CorrelationFilter
            correlationFilter:
              properties:
                file_type: commodity_data
                event: urn:message:IPAFFS.Messages.Events:FileUploaded
        documentSelector:
          path: metadata.name
          value: messaging-topic-fd90158d-commodity-file-upload-1a55a9fa-correlation-filter
