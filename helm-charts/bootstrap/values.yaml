service: "ipaffs"
project: ipaffs
environment: dev

azure:
  location: uksouth

serviceBus:
  queues: []
  topics: []

ipaffsConfig:
  data: {}

secretStore:
  name: "external-secrets-azure-ccoe"

externalSecret:
  enabled: false
  refreshInterval: ""
  secrets: []
  certs: []

# Namespace-wide port baseline. Enable for a pilot namespace before rollout.
# These lists are maintained from deployment configuration, not inferred at runtime.
networkPolicy:
  enabled: false
  # Actual destination pod ports, rather than the Service's port 80.
  ingressPorts: [4000, 8000]
  # In-cluster Redis is reachable only from pods in this namespace.
  sameNamespaceIngressPorts: [6379]
  # Port 80 and the pod ports cover Service translation across policy providers.
  egressPorts:
    - 80    # Internal IPAFFS HTTP Services (Service port).
    - 443   # Trade/CRM/RDS APIs, Entra ID, Application Insights and Azure Storage/Search/Key Vault.
    - 1344  # Symantec ICAP antivirus (file-upload and file-compression).
    - 1433  # Azure SQL databases (Private Link Proxy mode).
    - 4000  # openidtoken-service HTTP (pod port).
    - 5671  # Azure Service Bus / Event Hubs (TLS AMQP).
    - 6379  # imports-proxy-cache Redis (DEV).
    - 6380  # Azure Redis (TST/PRE/PRD, TLS).
    - 8000  # IPAFFS webapps/microservices and identity redirect handler (pod port).
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns

originIngress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "64k"
    nginx.ingress.kubernetes.io/proxy-body-size: "102m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "59"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "59"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Add AGC origin routes alongside the existing NGINX origin Ingress.
agc:
  enabled: false
  gateway:
    name: ipaffs-agc
    namespace: defra-certs
    sectionName: https
  frontDoorId: ""
  # Empty selects existing origin FQDNs; otherwise supply a subset of them.
  hosts: []
  # Optional whole-request deadline (e.g. 120s), not an NGINX inactivity timeout.
  requestTimeout: ""
