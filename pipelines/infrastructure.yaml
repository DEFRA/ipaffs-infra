---
# Automatic runs use the DEV parameter default. Batch merges while a run is active.
trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - bicep/**
      - pipelines/infrastructure.yaml
      - pipelines/stages/deploy-bicep-*.yaml
      - pipelines/jobs/infrastructure/*.yaml
      - pipelines/stages/tag-build.yaml
      - pipelines/stages/validate-access-contract.yaml
      - pipelines/stages/run-hooks.yaml
      - pipelines/stages/establish-peering.yaml
      - pipelines/stages/infra-permissions.yaml
      - pipelines/stages/private-endpoint-dns-records.yaml
      - pipelines/vars/common.yaml
      - pipelines/vars/dev.yaml
      - pipelines/vars/snd.yaml
      - scripts/pipeline/validate-access-contract.py
      - scripts/pipeline/sync-deployment-outputs.py
      - scripts/pipeline/add-principal-to-group.sh
      - scripts/pipeline/run-hooks.sh
      - scripts/pipeline/trigger-peering-pipeline.sh
      - scripts/hooks/*.sh
      - scripts/hooks/dev/*.sh
    exclude:
      - bicep/envs/tst/**
      - bicep/envs/pre/**
      - bicep/envs/prd/**

pr:
  branches:
    exclude:
      - '*'

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

parameters:
  - name: environmentName
    displayName: Environment
    type: string
    default: DEV
    values:
      - DEV
      - TST
      - PRE
      - PRD
  - name: establishPeering
    displayName: Establish Peering To Hub
    type: boolean
    default: false
  - name: runHooksOnBranch
    displayName: Apply hooks on non-main branch (use sparingly)
    type: boolean
    default: false
  - name: includePlatform
    displayName: Include Azure Private Link
    type: boolean
    default: true

variables:
  - group: Common
  - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
    - group: HigherEnvs
  - ${{ else }}:
    - group: LowerEnvs
  - group: "${{ parameters.environmentName }}"
  - template: "/pipelines/vars/common.yaml"
  - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

resources:
  repositories:
    - repository: PipelineCommon
      name: DEFRA-DEVOPS-COMMON/Defra.Pipeline.Common
      type: git
      ref: feature/v6-optional-subscription-for-private-endpoint-records

stages:
  - stage: Infrastructure
    displayName: Infrastructure
    isSkippable: false
    lockBehavior: sequential
    jobs:
      - template: jobs/infrastructure/tag-build.yaml
        parameters:
          tags:
            - Environment-${{ parameters.environmentName }}
          dependsOn: []
      - template: jobs/infrastructure/validate-access-contract.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          jobName: ValidateGroups
          dependsOn:
            - TagEnvironment_${{ parameters.environmentName }}
          jobVariables:
            - group: Common
            - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
                - group: HigherEnvs
            - ${{ else }}:
                - group: LowerEnvs
            - group: ${{ parameters.environmentName }}
      - template: jobs/infrastructure/run-hooks.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          applyOnBranch: ${{ parameters.runHooksOnBranch }}
          jobName: Hooks
          dependsOn:
            - ValidateGroups
      - template: jobs/infrastructure/deploy-bicep-resource-group.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          jobName: DeployResourceGroup
          dependsOn:
            - Hooks
          displayName: Deploy Resource Group
      - template: jobs/infrastructure/deploy-bicep-network.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          jobName: DeployNetwork
          dependsOn:
            - DeployResourceGroup
          displayName: Deploy Network
      - ${{ if parameters.establishPeering }}:
          - template: jobs/infrastructure/establish-peering.yaml
            parameters:
              environmentName: ${{ parameters.environmentName }}
              jobName: TriggerPeeringPipeline
              dependsOn:
                - DeployNetwork
              jobVariables:
                - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
                    - name: vnetName
                      value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.vnetName'] ]
      - ${{ if ne(parameters.environmentName, 'TST') }}:
          - template: jobs/infrastructure/deploy-bicep-acr.yaml
            parameters:
              environmentName: ${{ parameters.environmentName }}
              jobName: DeployACR
              dependsOn:
                - DeployNetwork
                - ${{ if parameters.establishPeering }}:
                    - TriggerPeeringPipeline
              jobVariables:
                - name: adoGroupName
                  ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
                    value: ${{ parameters.environmentName }}
                  ${{ else }}:
                    value: LowerEnvs
                - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
                    - name: privateEndpointsSubnetId
                      value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.privateEndpointsSubnetId'] ]
                    - name: privateEndpointsSubnetName
                      value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.privateEndpointsSubnetName'] ]
              displayName: Deploy ACR
      - template: jobs/infrastructure/deploy-bicep-classic.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          ${{ if eq(parameters.environmentName, 'DEV') }}:
            classicEnvironmentName: SND
          ${{ else }}:
            classicEnvironmentName: ${{ parameters.environmentName }}
          jobName: DeployClassic
          dependsOn:
            - ValidateGroups
            - ${{ if ne(parameters.environmentName, 'TST') }}:
                - DeployACR
            - ${{ if eq(parameters.environmentName, 'TST') }}:
                - ${{ if parameters.establishPeering }}:
                    - TriggerPeeringPipeline
                - ${{ else }}:
                    - DeployNetwork
          jobVariables:
            - group: ${{ replace(parameters.environmentName, 'DEV', 'SND') }}
            - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
                - group: HigherEnvs
            - ${{ else }}:
                - group: LowerEnvs
            - template: /pipelines/vars/common.yaml
            - template: /pipelines/vars/${{ lower(replace(parameters.environmentName, 'DEV', 'SND')) }}.yaml
            - name: parameterSqlAdminGroupId
              value: $(sqlAdminGroupId)
            - name: parameterSqlAdminGroupName
              value: $(sqlAdminGroupName)
            - name: parameterSqlAdminGroupId
              value: $[ dependencies.ValidateGroups.outputs['AccessContract.sqlAdminGroupId'] ]
            - name: parameterSqlAdminGroupName
              value: $[ dependencies.ValidateGroups.outputs['AccessContract.sqlAdminGroupName'] ]
          displayName: Deploy Classic
      - template: jobs/infrastructure/deploy-bicep-infra.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          jobName: DeployInfrastructure
          dependsOn:
            - DeployClassic
            - DeployNetwork
          jobVariables:
            - ${{ if ne(parameters.environmentName, 'TST') }}:
                - name: qaAutomationServiceConnectionPrincipalId
                  value: ''
            - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
                - name: aksApiServerSubnetId
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.aksApiServerSubnetId'] ]
                - name: aksApiServerSubnetName
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.aksApiServerSubnetName'] ]
                - name: aksSystemNodesSubnetId
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.aksSystemNodesSubnetId'] ]
                - name: aksSystemNodesSubnetName
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.aksSystemNodesSubnetName'] ]
                - name: aksUserNodesSubnetId
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.aksUserNodesSubnetId'] ]
                - name: aksUserNodesSubnetName
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.aksUserNodesSubnetName'] ]
                - name: appGatewayForContainersSubnetId
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.appGatewayForContainersSubnetId'] ]
                - name: appGatewayForContainersSubnetName
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.appGatewayForContainersSubnetName'] ]
                - name: privateEndpointsSubnetId
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.privateEndpointsSubnetId'] ]
                - name: privateEndpointsSubnetName
                  value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.privateEndpointsSubnetName'] ]
                - name: classicRedisResourceId
                  value: $[ dependencies.DeployClassic.outputs['DeployClassic.ClassicOutputs.classicRedisResourceId'] ]
                - name: classicSearchServiceResourceId
                  value: $[ dependencies.DeployClassic.outputs['DeployClassic.ClassicOutputs.classicSearchServiceResourceId'] ]
                - name: classicServiceBusNamespaceResourceId
                  value: $[ dependencies.DeployClassic.outputs['DeployClassic.ClassicOutputs.classicServiceBusNamespaceResourceId'] ]
                - name: classicSqlServerResourceId
                  value: $[ dependencies.DeployClassic.outputs['DeployClassic.ClassicOutputs.classicSqlServerResourceId'] ]
          displayName: Deploy Infrastructure
      - template: jobs/infrastructure/deploy-bicep-infra-to-classic.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          jobName: DeployInfrastructureToClassic
          dependsOn:
            - DeployInfrastructure
          jobVariables:
            - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
                - name: grafanaManagedIdentityPrincipalId
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.grafanaManagedIdentityPrincipalId'] ]
          displayName: Deploy Infrastructure to Classic
      - template: jobs/infrastructure/infra-permissions.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          jobName: GroupMemberships
          dependsOn:
            - DeployInfrastructureToClassic
            - DeployInfrastructure
          jobVariables:
            - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
                - name: aksClusterResourceId
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.aksClusterResourceId'] ]
                - name: aksKubeletPrincipalId
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.aksKubeletPrincipalId'] ]
                - name: externalSecretsPrincipalObjectId
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.externalSecretsPrincipalObjectId'] ]
                - name: sqlServerManagedIdentityObjectId
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.sqlServerManagedIdentityObjectId'] ]
                - name: searchServiceManagedIdentityPrincipalId
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.searchServiceManagedIdentityPrincipalId'] ]
      - template: jobs/infrastructure/private-endpoint-dns-records.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          dependsOn:
            - GroupMemberships
            - DeployInfrastructure
            - ${{ if ne(parameters.environmentName, 'TST') }}:
                - DeployACR
          jobVariables:
            - template: /templates/vars/common.yaml@PipelineCommon
            - template: /templates/vars/regional/northeurope.yaml@PipelineCommon
            - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
                - name: keyVaultName
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.keyVaultName'] ]
                - name: redisName
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.redisName'] ]
                - name: searchServiceName
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.searchServiceName'] ]
                - name: sqlServerName
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.sqlServerName'] ]
                - name: storageAccountName
                  value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.storageAccountName'] ]
                - ${{ if ne(parameters.environmentName, 'TST') }}:
                    - name: acrName
                      value: $[ dependencies.DeployACR.outputs['DeployACR.ACROutputs.acrName'] ]
                - ${{ if eq(parameters.environmentName, 'TST') }}:
                    - name: qaKeyVaultName
                      value: $[ dependencies.DeployInfrastructure.outputs['DeployInfrastructure.InfrastructureOutputs.qaKeyVaultName'] ]
      - ${{ if parameters.includePlatform }}:
          - template: jobs/infrastructure/deploy-bicep-privatelink.yaml
            parameters:
              environmentName: ${{ parameters.environmentName }}
              jobName: PrivateLink
              dependsOn:
                - ContainerRegistry
                - KeyVault
                - Redis
                - Search
                - Storage
                - SQLServer
                - DeployNetwork
              jobVariables:
                - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
                    - name: privateEndpointsSubnetId
                      value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.privateEndpointsSubnetId'] ]
                    - name: privateEndpointsSubnetName
                      value: $[ dependencies.DeployNetwork.outputs['DeployNetwork.NetworkOutputs.privateEndpointsSubnetName'] ]
              displayName: Private Link
