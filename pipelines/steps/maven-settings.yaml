---
# Provides the Maven settings for a job as the variable $(mavenSettingsFile): generated
# settings that resolve everything through the DEFRA-EUTD-IPAFFS Azure Artifacts feed (its
# upstreams include Maven Central and JitPack) and deploy to it (server id DEFRA-EUTD-IPAFFS).
# No stored credentials: the password is System.AccessToken, so the step that runs Maven
# must map SYSTEM_ACCESSTOKEN: $(System.AccessToken) into its env.

parameters:
  # only feed; kept so pipelines that set it still work
  - name: mavenRegistry
    type: string
    default: feed
    values:
      - feed

steps:
  - task: Bash@3
    displayName: Write Maven settings for the Azure Artifacts feed
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        file="$(Agent.TempDirectory)/maven-feed-settings.xml"
        # The password stays a Maven expression; the token is only read from the environment.
        cat > "${file}" <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
          <servers>
            <server>
              <id>DEFRA-EUTD-IPAFFS</id>
              <username>build</username>
              <password>${env.SYSTEM_ACCESSTOKEN}</password>
            </server>
          </servers>
          <mirrors>
            <mirror>
              <id>DEFRA-EUTD-IPAFFS</id>
              <mirrorOf>*</mirrorOf>
              <url>https://pkgs.dev.azure.com/defragovuk/DEFRA-EUTD-IPAFFS/_packaging/DEFRA-EUTD-IPAFFS/maven/v1</url>
            </mirror>
          </mirrors>
          <!-- As in the secure file: the POMs' jenkins profile turns off CI-unsuitable
               steps, such as git-build-hook installing the repo's git hooks, whose
               pre-push hook (trufflehog) would block the release push. -->
          <activeProfiles>
            <activeProfile>jenkins</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        echo "##vso[task.setvariable variable=mavenSettingsFile]${file}"
