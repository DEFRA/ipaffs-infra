parameters:
  - name: referenceBranch
    type: string
    default: main

  # Both are spliced unquoted into the docker command line: values must be
  # space-separated arguments free of shell metacharacters.
  - name: extraProperties
    type: string
    default: ''

  - name: extraDockerArgs
    type: string
    default: ''

steps:
  - task: Bash@3
    displayName: Run SonarQube analysis
    continueOnError: true
    env:
      SONAR_HOST_URL: $(sonarHostUrl)
      SONAR_TOKEN: $(sonarToken)
      SOURCE_BRANCH: $(Build.SourceBranch)
      REFERENCE_BRANCH: ${{ parameters.referenceBranch }}
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        branch_name="${SOURCE_BRANCH#refs/heads/}"

        scanner_args=("-Dsonar.branch.name=${branch_name}")
        if [[ "${branch_name}" != "${REFERENCE_BRANCH}" ]]; then
          scanner_args+=("-Dsonar.newCode.referenceBranch=${REFERENCE_BRANCH}")
        fi

        # SONAR_TOKEN goes through the environment only, never the command line.
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e SONAR_HOST_URL \
          -e SONAR_TOKEN \
          -v "${PWD}:/usr/src" \
          ${{ parameters.extraDockerArgs }} \
          sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1 \
          "${scanner_args[@]}" ${{ parameters.extraProperties }}
