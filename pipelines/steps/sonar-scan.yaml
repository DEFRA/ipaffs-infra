---
parameters:
  # Overrides the sonarHostUrl variable from /pipelines/vars/common.yaml.
  - name: sonarHostUrl
    type: string
    default: ' '

  - name: scannerImage
    type: string
    default: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1

  - name: referenceBranch
    type: string
    default: main

  - name: extraProperties
    type: string
    default: ' '

  - name: extraDockerArgs
    type: string
    default: ' '

steps:
  - task: Bash@3
    displayName: Run SonarQube analysis
    continueOnError: true
    env:
      SONAR_HOST_URL: $(sonarHostUrl)
      SONAR_HOST_URL_PARAMETER: ${{ parameters.sonarHostUrl }}
      SONAR_TOKEN: $(sonarToken)
      SOURCE_BRANCH: $(Build.SourceBranch)
      REFERENCE_BRANCH: ${{ parameters.referenceBranch }}
      SCANNER_IMAGE: ${{ parameters.scannerImage }}
      EXTRA_PROPERTIES: ${{ parameters.extraProperties }}
      EXTRA_DOCKER_ARGS: ${{ parameters.extraDockerArgs }}
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        if [[ -n "${SONAR_HOST_URL_PARAMETER// /}" ]]; then
          SONAR_HOST_URL="${SONAR_HOST_URL_PARAMETER}"
        fi
        echo "Publishing analysis to ${SONAR_HOST_URL}"

        branch_name="${SOURCE_BRANCH#refs/heads/}"

        scanner_args=("-Dsonar.branch.name=${branch_name}")
        if [[ "${branch_name}" != "${REFERENCE_BRANCH}" ]]; then
          scanner_args+=("-Dsonar.newCode.referenceBranch=${REFERENCE_BRANCH}")
        fi

        if [[ -n "${EXTRA_PROPERTIES// /}" ]]; then
          read -r -a extra_property_args <<< "${EXTRA_PROPERTIES}"
          scanner_args+=("${extra_property_args[@]}")
        fi

        docker_args=()
        if [[ -n "${EXTRA_DOCKER_ARGS// /}" ]]; then
          read -r -a docker_args <<< "${EXTRA_DOCKER_ARGS}"
        fi

        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e SONAR_HOST_URL \
          -e SONAR_TOKEN \
          -v "${PWD}:/usr/src" \
          "${docker_args[@]}" \
          "${SCANNER_IMAGE}" \
          "${scanner_args[@]}"
