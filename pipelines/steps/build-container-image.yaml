parameters:
  - name: directory
    type: string

  - name: dockerFile
    type: string

  - name: imageName
    type: string

  - name: acrName
    type: string
    default: ' '

  - name: acrSubscriptionName
    type: string
    default: ' '

  - name: tagName
    type: string
    default: ' '

  # passes gitHubToken to the build as the secret npm_token, for Dockerfiles that install @defra packages
  - name: npmTokenSecret
    type: boolean
    default: false

steps:
  - task: AzureCLI@2
    displayName: Build and Push Container Image
    env:
      ACR_NAME_PARAMETER: ${{ parameters.acrName }}
      ACR_SUBSCRIPTION_NAME_PARAMETER: ${{ parameters.acrSubscriptionName }}
      TAG_NAME_PARAMETER: ${{ parameters.tagName }}
      ${{ if eq(parameters.npmTokenSecret, true) }}:
        DOCKER_BUILDKIT: 1
        NPM_TOKEN: $(gitHubToken)
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -x
        if [[ -n "${ACR_NAME_PARAMETER// /}" ]]; then
          ACR_NAME="${ACR_NAME_PARAMETER}"
        else
          ACR_NAME="$(acrName)"
        fi

        if [[ -n "${ACR_SUBSCRIPTION_NAME_PARAMETER// /}" ]]; then
          SUBSCRIPTION_NAME="${ACR_SUBSCRIPTION_NAME_PARAMETER}"
        else
          SUBSCRIPTION_NAME="$(subscriptionName)"
        fi

        if [[ -n "${TAG_NAME_PARAMETER// /}" ]]; then
          TAG_NAME="${TAG_NAME_PARAMETER}"
        else
          TAG_NAME="$(Build.BuildNumber)"
        fi

        az acr login --name "${ACR_NAME}" --subscription "${SUBSCRIPTION_NAME}"
        SECRET_ARGS=()
        if [[ "${{ parameters.npmTokenSecret }}" == "True" ]]; then
          SECRET_ARGS=(--secret id=npm_token,env=NPM_TOKEN)
        fi
        docker build --platform=linux/amd64 "${SECRET_ARGS[@]}" --tag "${{ parameters.imageName }}:${TAG_NAME}" --file "${{ parameters.dockerFile }}" "${{ parameters.directory }}"
        docker tag "${{ parameters.imageName }}:${TAG_NAME}" "${ACR_NAME}.azurecr.io/ipaffs/${{ parameters.imageName }}:${TAG_NAME}"
        docker push "${ACR_NAME}.azurecr.io/ipaffs/${{ parameters.imageName }}:${TAG_NAME}"
