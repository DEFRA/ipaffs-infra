parameters:
  - name: directory
    type: string

  - name: dockerFile
    type: string

  - name: imageName
    type: string

  - name: acrName
    type: string
    default: ' '

  - name: acrSubscriptionName
    type: string
    default: ' '

  - name: tagName
    type: string
    default: ' '

steps:
  - task: AzureCLI@2
    displayName: Build and Push Container Image
    env:
      ACR_NAME_PARAMETER: ${{ parameters.acrName }}
      ACR_SUBSCRIPTION_NAME_PARAMETER: ${{ parameters.acrSubscriptionName }}
      TAG_NAME_PARAMETER: ${{ parameters.tagName }}
      ACR_NAME_DEFAULT: $(acrName)
      TAG_NAME_DEFAULT: $(Build.BuildNumber)
    inputs:
      # Registry ownership differs from cluster ownership in TST, which shares DEV's ACR.
      azureSubscription: $(acrGroupsServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set +x
        set -euo pipefail
        if [[ -n "${ACR_NAME_PARAMETER// /}" ]]; then
          ACR_NAME="${ACR_NAME_PARAMETER}"
        else
          ACR_NAME="${ACR_NAME_DEFAULT}"
        fi

        if [[ -n "${ACR_SUBSCRIPTION_NAME_PARAMETER// /}" ]]; then
          SUBSCRIPTION_NAME="${ACR_SUBSCRIPTION_NAME_PARAMETER}"
        else
          SUBSCRIPTION_NAME="$(az account show --query id --output tsv --only-show-errors)"
        fi

        if [[ -n "${TAG_NAME_PARAMETER// /}" ]]; then
          TAG_NAME="${TAG_NAME_PARAMETER}"
        else
          TAG_NAME="${TAG_NAME_DEFAULT}"
        fi

        az acr login --name "${ACR_NAME}" --subscription "${SUBSCRIPTION_NAME}"
        docker build --platform=linux/amd64 --tag "${{ parameters.imageName }}:${TAG_NAME}" --file "${{ parameters.dockerFile }}" "${{ parameters.directory }}"
        docker tag "${{ parameters.imageName }}:${TAG_NAME}" "${ACR_NAME}.azurecr.io/ipaffs/${{ parameters.imageName }}:${TAG_NAME}"
        docker push "${ACR_NAME}.azurecr.io/ipaffs/${{ parameters.imageName }}:${TAG_NAME}"
