trigger: none
pr: none

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

jobs:
  - job: InspectPrePdb
    displayName: Read-only PRE PDB investigation
    timeoutInMinutes: 30
    steps:
      - checkout: self
        clean: true
      - task: AzureCLI@2
        displayName: Read PRE workload and PDB metadata
        env:
          KUBECONFIG: $(Agent.TempDirectory)/pre-pdb-$(System.JobId)/kubeconfig
          PRE_PRIVATE: $(Agent.TempDirectory)/pre-pdb-$(System.JobId)
          PRE_REPORT: $(Build.ArtifactStagingDirectory)/pre-pdb-readonly
        inputs:
          azureSubscription: ADO-DefraGovUK-AZR-IMP-PRE1
          visibleAzLogin: false
          useGlobalConfig: false
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            umask 077
            mkdir -p "$PRE_PRIVATE/bin" "$PRE_REPORT"
            trap 'rm -rf -- "$PRE_PRIVATE"' EXIT
            export PATH="$PRE_PRIVATE/bin:$PATH"
            if ! aks_version="$(az aks show --name PREIMPINFAK1401 --resource-group PREIMPINFRG1401 --subscription 3978eb4f-add1-415d-839b-db398e65a7d9 --query currentKubernetesVersion --output tsv --only-show-errors 2>/dev/null)"; then
              echo 'PRE_CLUSTER_READ_FAILED'
              exit 1
            fi
            if ! [[ "$aks_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'PRE_CLIENT_VERSION_UNAVAILABLE'
              exit 1
            fi
            if ! az aks install-cli --client-version "v$aks_version" --kubelogin-version v0.2.18 --install-location "$PRE_PRIVATE/bin/kubectl" --kubelogin-install-location "$PRE_PRIVATE/bin/kubelogin" >/dev/null 2>&1; then
              echo 'PRE_CLIENT_PREPARATION_FAILED'
              exit 1
            fi
            if ! az aks get-credentials --name PREIMPINFAK1401 --resource-group PREIMPINFRG1401 --subscription 3978eb4f-add1-415d-839b-db398e65a7d9 --context PRE-PDB-READONLY --file "$KUBECONFIG" >/dev/null 2>&1; then
              echo 'PRE_USER_ACCESS_PREPARATION_FAILED'
              exit 1
            fi
            if ! kubelogin convert-kubeconfig -l azurecli >/dev/null 2>&1; then
              echo 'PRE_USER_AUTHENTICATION_PREPARATION_FAILED'
              exit 1
            fi
            python3 scripts/pipeline/inspect-pre-pdb.py --output-dir "$PRE_REPORT"
      - task: PublishPipelineArtifact@1
        displayName: Publish sanitized PRE diagnostic
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/pre-pdb-readonly
          artifact: pre-pdb-readonly
