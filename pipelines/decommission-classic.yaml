---
name: decommission-classic-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

parameters:
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - delete

stages:
  - template: stages/tag-build.yaml
    parameters:
      tags:
        - ServiceGroup-decommission-classic
        - Action-${{ parameters.action }}

  - template: stages/decommission-classic.yaml
    parameters:
      environmentName: SND
      subscriptionId: e716414f-1f8e-48f1-8f56-65f35cfdafb6 # AZR-SND
      action: ${{ parameters.action }}
      dependsOn: TagBuild

  - ${{ if eq(parameters.action, 'delete') }}:
    - stage: GateToTST
      displayName: Manual approval before TST deletion
      dependsOn: DeleteSND
      isSkippable: false
      jobs:
        - job: AwaitApproval
          displayName: Await TST approval
          pool: server
          timeoutInMinutes: 43200
          steps:
            - task: ManualValidation@1
              timeoutInMinutes: 43199
              inputs:
                notifyUsers: $(Build.RequestedForEmail)
                allowApproversToApproveTheirOwnRuns: false
                instructions: >-
                  Review the completed SND deletion in this run. Approve to
                  proceed to TST deletion review once the TST plan succeeds,
                  or reject to stop before TST deletion.
                onTimeout: reject

  - template: stages/decommission-classic.yaml
    parameters:
      environmentName: TST
      subscriptionId: 00f1225e-37c2-4c7b-bc71-634164b667c6 # AZR-TST
      action: ${{ parameters.action }}
      dependsOn: TagBuild
      deleteGate: GateToTST
