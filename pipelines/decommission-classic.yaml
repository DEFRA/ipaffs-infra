---
name: decommission-classic-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

parameters:
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - delete

  - name: planRunId
    displayName: Plan run ID (required for delete)
    type: number
    default: 0

stages:
  - template: stages/tag-build.yaml
    parameters:
      tags:
        - ServiceGroup-decommission-classic
        - Action-${{ parameters.action }}

  - ${{ if eq(parameters.action, 'delete') }}:
    - stage: ValidatePlanRun
      displayName: Validate selected plan run
      dependsOn: TagBuild
      isSkippable: false
      jobs:
        - job: ValidatePlanRun
          steps:
            - checkout: none
            - bash: |
                set -euo pipefail

                if [[ ! "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
                  echo 'Enter the run ID of a successful plan run on main.' >&2
                  exit 1
                fi

                build_url="${COLLECTION_URI}${PROJECT_ID}/_apis/build/builds/${PLAN_RUN_ID}"
                build=$(curl --fail --silent --show-error --retry 2 --max-time 30 \
                  -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" "${build_url}?api-version=7.1")
                if ! jq -e --arg definition "$DEFINITION_ID" --arg repository "$REPOSITORY_ID" '
                  (.definition.id | tostring) == $definition and
                  .repository.id == $repository and .sourceBranch == "refs/heads/main" and
                  .status == "completed" and .result == "succeeded" and
                  (.templateParameters.action // "plan") == "plan" and
                  (.tags // [] | index("Action-plan") != null)
                ' <<< "$build" >/dev/null; then
                  echo "Run $PLAN_RUN_ID must be a successful plan run on main from this pipeline." >&2
                  exit 1
                fi

                artifacts=$(curl --fail --silent --show-error --retry 2 --max-time 30 \
                  -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" "${build_url}/artifacts?api-version=7.1")
                if ! jq -e '[.value[].name] |
                  index("classic-decommission-plan-SND") != null and
                  index("classic-decommission-plan-TST") != null' <<< "$artifacts" >/dev/null; then
                  echo "Run $PLAN_RUN_ID must have both SND and TST plan artifacts." >&2
                  exit 1
                fi
                echo "Using SND and TST plans from run $PLAN_RUN_ID."
              displayName: Check plan run and artifacts
              env:
                PLAN_RUN_ID: ${{ parameters.planRunId }}
                COLLECTION_URI: $(System.CollectionUri)
                PROJECT_ID: $(System.TeamProjectId)
                DEFINITION_ID: $(System.DefinitionId)
                REPOSITORY_ID: $(Build.Repository.ID)
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - template: stages/decommission-classic.yaml
    parameters:
      environmentName: SND
      subscriptionId: e716414f-1f8e-48f1-8f56-65f35cfdafb6 # AZR-SND
      action: ${{ parameters.action }}
      planRunId: ${{ parameters.planRunId }}
      ${{ if eq(parameters.action, 'delete') }}:
        dependsOn: ValidatePlanRun
      ${{ else }}:
        dependsOn: TagBuild

  - ${{ if eq(parameters.action, 'delete') }}:
    - stage: GateToTST
      displayName: Manual approval before TST deletion
      dependsOn: DeleteSND
      isSkippable: false
      jobs:
        - job: AwaitApproval
          displayName: Await TST approval
          pool: server
          timeoutInMinutes: 43200
          steps:
            - task: ManualValidation@1
              timeoutInMinutes: 43199
              inputs:
                notifyUsers: $(Build.RequestedForEmail)
                allowApproversToApproveTheirOwnRuns: false
                instructions: >-
                  Review the completed SND deletion in this run. Approve to
                  proceed to TST deletion review, or reject to stop before TST deletion.
                onTimeout: reject

  - template: stages/decommission-classic.yaml
    parameters:
      environmentName: TST
      subscriptionId: 00f1225e-37c2-4c7b-bc71-634164b667c6 # AZR-TST
      action: ${{ parameters.action }}
      planRunId: ${{ parameters.planRunId }}
      ${{ if eq(parameters.action, 'delete') }}:
        dependsOn: GateToTST
      ${{ else }}:
        dependsOn: TagBuild
