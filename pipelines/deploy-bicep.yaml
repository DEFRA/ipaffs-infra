---
# Infrastructure owns automatic DEV deployments; retain this entry point for previews/manual runs.
trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - bicep/**/*.bicepparam
      - bicep/**/*.bicep
      - pipelines/deploy-bicep.yaml
      - pipelines/stages/deploy-bicep-*.yaml
      - pipelines/stages/validate-access-contract.yaml
      - scripts/pipeline/validate-access-contract.py

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

parameters:
  - name: environmentName
    displayName: Environment
    type: string
    default: DEV
    values:
      - DEV
      - TST
      - PRE
      - PRD
  - name: establishPeering
    displayName: Establish Peering To Hub
    type: boolean
    default: false

variables:
  - group: Common
  - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
    - group: HigherEnvs
  - ${{ else }}:
    - group: LowerEnvs
  - group: "${{ parameters.environmentName }}"
  - template: "/pipelines/vars/common.yaml"
  - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

stages:
  - template: stages/tag-build.yaml
    parameters:
      tags:
        - Environment-${{ parameters.environmentName }}

  - template: stages/validate-access-contract.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}

  - template: stages/deploy-bicep-resource-group.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}

  - template: stages/deploy-bicep-network.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}

  - ${{ if parameters.establishPeering }}:
    - template: stages/establish-peering.yaml
      parameters:
        environmentName: ${{ parameters.environmentName }}
        dependsOn: [DeployNetwork]
        ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
          deploymentVariables:
            vnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.vnetName'] ]

  - ${{ if or(eq(parameters.environmentName, 'DEV'), eq(parameters.environmentName, 'PRE'), eq(parameters.environmentName, 'PRD')) }}:
    - template: stages/deploy-bicep-acr.yaml
      parameters:
        environmentName: ${{ parameters.environmentName }}
        dependsOn:
          - DeployNetwork
          - ${{ if parameters.establishPeering }}:
            - EstablishPeering
        ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
          deploymentVariables:
            privateEndpointsSubnetId: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.privateEndpointsSubnetId'] ]
            privateEndpointsSubnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.privateEndpointsSubnetName'] ]

  - template: stages/deploy-bicep-classic.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}
      ${{ if eq(parameters.environmentName, 'DEV') }}:
        classicEnvironmentName: SND
      ${{ else }}:
        classicEnvironmentName: ${{ parameters.environmentName }}
      dependsOn:
        - ValidateAccessContract
        - ${{ if ne(parameters.environmentName, 'TST') }}:
          - DeployACR
        - ${{ if eq(parameters.environmentName, 'TST') }}:
          - ${{ if parameters.establishPeering }}:
            - EstablishPeering
          - ${{ else }}:
            - DeployNetwork
      deploymentVariables:
        parameterSqlAdminGroupId: $[ stageDependencies.ValidateAccessContract.ValidateGroups.outputs['AccessContract.sqlAdminGroupId'] ]
        parameterSqlAdminGroupName: $[ stageDependencies.ValidateAccessContract.ValidateGroups.outputs['AccessContract.sqlAdminGroupName'] ]

  - template: stages/deploy-bicep-infra.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}
      dependsOn: [DeployClassic, DeployNetwork]
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
        deploymentVariables:
          aksApiServerSubnetId: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.aksApiServerSubnetId'] ]
          aksApiServerSubnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.aksApiServerSubnetName'] ]
          aksSystemNodesSubnetId: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.aksSystemNodesSubnetId'] ]
          aksSystemNodesSubnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.aksSystemNodesSubnetName'] ]
          aksUserNodesSubnetId: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.aksUserNodesSubnetId'] ]
          aksUserNodesSubnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.aksUserNodesSubnetName'] ]
          appGatewayForContainersSubnetId: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.appGatewayForContainersSubnetId'] ]
          appGatewayForContainersSubnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.appGatewayForContainersSubnetName'] ]
          privateEndpointsSubnetId: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.privateEndpointsSubnetId'] ]
          privateEndpointsSubnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.privateEndpointsSubnetName'] ]
          classicRedisResourceId: $[ stageDependencies.DeployClassic.RunBicep.outputs['RunBicep.ClassicOutputs.classicRedisResourceId'] ]
          classicSearchServiceResourceId: $[ stageDependencies.DeployClassic.RunBicep.outputs['RunBicep.ClassicOutputs.classicSearchServiceResourceId'] ]
          classicServiceBusNamespaceResourceId: $[ stageDependencies.DeployClassic.RunBicep.outputs['RunBicep.ClassicOutputs.classicServiceBusNamespaceResourceId'] ]
          classicSqlServerResourceId: $[ stageDependencies.DeployClassic.RunBicep.outputs['RunBicep.ClassicOutputs.classicSqlServerResourceId'] ]

  - template: stages/deploy-bicep-infra-to-classic.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}
      dependsOn: [DeployInfrastructure]
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
        deploymentVariables:
          grafanaManagedIdentityPrincipalId: $[ stageDependencies.DeployInfrastructure.RunBicep.outputs['RunBicep.InfrastructureOutputs.grafanaManagedIdentityPrincipalId'] ]

  - template: stages/deploy-bicep-privatelink.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}
      dependsOn: [DeployInfrastructureToClassic, DeployNetwork]
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
        deploymentVariables:
          privateEndpointsSubnetId: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.privateEndpointsSubnetId'] ]
          privateEndpointsSubnetName: $[ stageDependencies.DeployNetwork.RunBicep.outputs['RunBicep.NetworkOutputs.privateEndpointsSubnetName'] ]

  # TODO: enable when ADO permissions are granted for DNS zones
  #- template: stages/deploy-bicep-dns.yaml
  #  parameters:
  #    environmentName: ${{ parameters.environmentName }}
