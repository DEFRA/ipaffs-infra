---
# Main deployments reconcile Azure Private Link; pull requests preview Bicep
# against DEV. Platform images and cluster charts belong to ipaffs-manifest.
# Core infrastructure and the ingress load balancer must already exist.
trigger: none
pr:
  drafts: true
  branches:
    include:
      - main
  paths:
    include:
      - pipelines/infra-platform.yaml
      - pipelines/stages/deploy-bicep-privatelink.yaml
      - pipelines/vars/common.yaml
      - pipelines/vars/dev.yaml
      - bicep/50-privatelink.bicep
      - bicep/modules/privatelink.bicep
      - bicep/envs/dev/50-privatelink.bicepparam
      - bicep/default-tags.json
      - bicep/bicepconfig.json

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

parameters:
  - name: environmentName
    displayName: Environment
    type: string
    default: DEV
    values:
      - DEV
      - TST
      - PRE
      - PRD

variables:
  - group: Common
  - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
    - group: HigherEnvs
  - ${{ else }}:
    - group: LowerEnvs
  - group: "${{ parameters.environmentName }}"
  - template: "/pipelines/vars/common.yaml"
  - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

stages:
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    - stage: TagBuild
      displayName: Tag environment
      jobs:
        - job: TagEnvironment
          steps:
            - checkout: none
            - bash: echo "##vso[build.addbuildtag]Environment-${{ parameters.environmentName }}"
              displayName: Tag environment

  - template: stages/deploy-bicep-privatelink.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}
