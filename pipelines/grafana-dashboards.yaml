---
# grafana-dashboards.yaml
#
# Single-run pipeline for deploying Grafana dashboards to all environments
# Azure Managed Grafana instances.
#
# ── Dashboard lifecycle ────────────────────────────────────────────────────
#
#  1. Author a dashboard manually in an environment's Grafana instance
#     (e.g. "IPAFFS_stack" in DEV).
#  2. Export it with the helper script (run locally or as a one-off):
#       GRAFANA_NAME=DEVIMPINFGA1401 \
#       RESOURCE_GROUP=DEVIMPINFRG1401 \
#       DASHBOARD_TITLE=<title> \
#       bash grafana-dashboards/scripts/export-dashboard.sh
#     The exported JSON keeps the dashboard's template variables (the
#     namespace / datasource dropdowns), so they travel with it.
#  3. Commit the JSON under grafana-dashboards/dashboards/
#     (deployed to individual environment). Per-env dashboards are not
#     supported yet and can be added later.
#  4. The pipeline validates and (on main) deploys to every environment
#     in turn.
#
# ── Deployment model ───────────────────────────────────────────────────────
#
#  Fixed order: DEV, TST, PRE, PRD (the environments this repo defines
#  variable groups, pipelines/vars/*.yaml templates and Environment resources
#  for). Not a run-time parameter - reordering it would silently break
#  promotion order, and adding a new name here wouldn't work anyway without
#  also adding its vars file, variable group, serviceConnections entry (see
#  deploy-grafana-dashboards.yaml) and Environment resource, so it's a
#  deliberate one-time code change, not something to expose as a queue-time
#  choice. Every run validates the dashboard JSON once, then deploys in
#  order:
#
#    ValidateDashboards -> Deploy DEV -> [manual approval] -> Deploy TST
#      -> Deploy PRE -> Deploy PRD
#
#  There is a single manual approval gate, after DEV, before TST. Its only
#  job is to make sure someone looked at DEV's dashboards before the
#  pipeline carries on, unattended, through the rest. This keeps every
#  environment on the same dashboard version instead of letting them drift
#  from separate, independently-run deploys.
#
#  TST/PRE/PRD only ever deploy on main - there is no override for this. DEV
#  can ALSO deploy off main, but only for a manually-queued run, and only
#  after someone approves the ApproveBranchDeploy gate (see
#  approve-branch-deploy-gate.yaml); on main that gate is skipped and DEV
#  deploys immediately. Every stage after DEV only ever proceeds once the
#  stage before it has genuinely Succeeded (not just Skipped) - so on a
#  non-main run, everything past DEV shows as Skipped rather than a
#  misleading "completed".
#
# ── Optional one-off stage ─────────────────────────────────────────────────
#
#  configureDatasources (default: false)
#    Creates / updates the Prometheus and Azure Monitor datasources that the
#    dashboard variables query, in configureDatasourcesEnvironment's own
#    Grafana instance. Idempotent. Run once when first setting up an env (or
#    adding a new one). Always requires main.
#
#  NOTE: the Grafana managed identity is assumed to already hold the data-read
#  roles (Monitoring Data Reader / Log Analytics Reader); those are granted
#  manually for now and are out of scope for this pipeline.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - grafana-dashboards/**
      - pipelines/grafana-dashboards.yaml
      - pipelines/stages/configure-grafana.yaml
      - pipelines/stages/deploy-grafana-dashboards.yaml
      - pipelines/stages/approve-grafana-gate.yaml
      - pipelines/stages/approve-branch-deploy-gate.yaml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - grafana-dashboards/**
      - pipelines/grafana-dashboards.yaml
      - pipelines/stages/configure-grafana.yaml
      - pipelines/stages/deploy-grafana-dashboards.yaml
      - pipelines/stages/approve-grafana-gate.yaml
      - pipelines/stages/approve-branch-deploy-gate.yaml

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

# ── Parameters ────────────────────────────────────────────────────────────

parameters:
  - name: configureDatasources
    displayName: "Configure datasources (one-off; run once per env when first setting it up)"
    type: boolean
    default: false

  - name: configureDatasourcesEnvironment
    displayName: "Environment to configure datasources in (only used when configureDatasources is ticked)"
    type: string
    default: DEV
    values:
      - DEV
      - TST
      - PRE
      - PRD

# ── Variables ─────────────────────────────────────────────────────────────

variables:
  - group: Common

# ── Stages ────────────────────────────────────────────────────────────────

stages:
  - template: stages/tag-build.yaml
    parameters:
      tags:
        - GrafanaDashboards-DEV
        - GrafanaDashboards-TST
        - GrafanaDashboards-PRE
        - GrafanaDashboards-PRD

  # 1. Validate dashboard JSON
  - stage: ValidateDashboards
    displayName: Validate Dashboard JSON
    jobs:
      - job: Validate
        displayName: Lint and validate dashboard files
        steps:
          - checkout: self

          - task: Bash@3
            displayName: Validate dashboard JSON files
            inputs:
              targetType: filePath
              filePath: grafana-dashboards/tests/validate-dashboards.sh

  # 2. Configure datasources (optional, one-off)
  - ${{ if eq(parameters.configureDatasources, true) }}:
    - template: stages/configure-grafana.yaml
      parameters:
        targetEnvironment: ${{ parameters.configureDatasourcesEnvironment }}

  # 3. Approval gate for deploying DEV off main (Skipped, and not waited on,
  #    for main runs and for automatic PR/CI builds)
  - template: stages/approve-branch-deploy-gate.yaml
    parameters:
      environment: DEV

  # 4. Deploy to DEV
  - template: stages/deploy-grafana-dashboards.yaml
    parameters:
      targetEnvironment: DEV
      branchApprovalGate: true

  # 5. Approval gate before continuing past DEV
  - template: stages/approve-grafana-gate.yaml
    parameters:
      afterEnvironment: DEV

  # 6. Deploy TST, PRE, PRD in order. No further gates, but each only
  #    proceeds if the stage before it genuinely Succeeded - off main, the
  #    gate above is Skipped, so everything from here on shows Skipped too,
  #    not a misleading "completed".
  - template: stages/deploy-grafana-dashboards.yaml
    parameters:
      targetEnvironment: TST
      gateStageName: ApproveGrafanaGate

  - template: stages/deploy-grafana-dashboards.yaml
    parameters:
      targetEnvironment: PRE

  - template: stages/deploy-grafana-dashboards.yaml
    parameters:
      targetEnvironment: PRD

# vim: set ts=2 sts=2 sw=2 et:
