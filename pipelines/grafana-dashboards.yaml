---
# grafana-dashboards.yaml
#
# Single-run pipeline for deploying Grafana dashboards to all per-environment
# Azure Managed Grafana instances.
#
# ── Dashboard lifecycle ────────────────────────────────────────────────────
#
#  1. Author a dashboard manually in an environment's Grafana instance
#     (e.g. "IPAFFS_stack" in DEV).
#  2. Export it with the helper script (run locally or as a one-off):
#       GRAFANA_NAME=DEVIMPINFGA1401 \
#       RESOURCE_GROUP=DEVIMPINFRG1401 \
#       DASHBOARD_TITLE=<title> \
#       bash grafana-dashboards/scripts/export-dashboard.sh
#     The exported JSON keeps the dashboard's template variables (the
#     namespace / datasource dropdowns), so they travel with it.
#  3. Commit the JSON under grafana-dashboards/dashboards/
#     (deployed to every environment). Per-env dashboards are not
#     supported yet and can be added later.
#  4. Push; the pipeline validates and (on main) deploys to every environment
#     in turn.
#
# ── Deployment model ───────────────────────────────────────────────────────
#
#  The "environments" parameter is an ORDERED list (default: DEV, TST, PRE,
#  PRD - the environments this repo defines variable groups and
#  pipelines/vars/*.yaml templates for). Every run validates the dashboard
#  JSON once, then deploys to each environment in that order:
#
#    ValidateDashboards -> Deploy environments[0] -> [manual approval]
#      -> Deploy environments[1] -> Deploy environments[2] -> ...
#
#  There is a single manual approval gate, always placed right after the
#  FIRST environment in the list (DEV, by default) - not one per
#  environment, and not hardcoded to any particular environment name. Its
#  only job is to make sure a human has looked at that first environment's
#  dashboards before the pipeline carries on, unattended, through the rest.
#  This keeps every environment on the same dashboard version instead of
#  letting them drift from separate, independently-run deploys.
#
#  Every environment except the first only ever deploys on main.
#  "allowFirstEnvBranchDeploy" lets the first environment deploy from the
#  branch you queued on (for testing before merging); it never affects any
#  other environment.
#
# ── Optional one-off stage ─────────────────────────────────────────────────
#
#  configureDatasources (default: false)
#    Creates / updates the Prometheus and Azure Monitor datasources that the
#    dashboard variables query, in configureDatasourcesEnvironment's own
#    Grafana instance. Idempotent. Run once when first setting up an env (or
#    adding a new one).
#
#  NOTE: the Grafana managed identity is assumed to already hold the data-read
#  roles (Monitoring Data Reader / Log Analytics Reader); those are granted
#  manually for now and are out of scope for this pipeline.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - grafana-dashboards/**
      - pipelines/grafana-dashboards.yaml
      - pipelines/stages/configure-grafana.yaml
      - pipelines/stages/deploy-grafana-dashboards.yaml
      - pipelines/stages/approve-grafana-gate.yaml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - grafana-dashboards/**
      - pipelines/grafana-dashboards.yaml
      - pipelines/stages/configure-grafana.yaml
      - pipelines/stages/deploy-grafana-dashboards.yaml
      - pipelines/stages/approve-grafana-gate.yaml

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

# ── Parameters ────────────────────────────────────────────────────────────

parameters:
  - name: environments
    displayName: "Environments to deploy to, in order (a single manual approval gate sits after the first one)"
    type: object
    default:
      - DEV
      - TST
      - PRE
      - PRD

  - name: allowFirstEnvBranchDeploy
    displayName: "Deploy the first environment from this branch (testing only; every other environment always requires main)"
    type: boolean
    default: false

  - name: configureDatasources
    displayName: "Configure datasources (one-off; run once per env when first setting it up)"
    type: boolean
    default: false

  - name: configureDatasourcesEnvironment
    displayName: "Environment to configure datasources in (only used when configureDatasources is ticked)"
    type: string
    default: DEV
    values:
      - DEV
      - TST
      - PRE
      - PRD

# ── Variables ─────────────────────────────────────────────────────────────

variables:
  - group: Common

# ── Stages ────────────────────────────────────────────────────────────────

stages:
  # Tag the build. A first-environment branch-deploy only tags that one
  # environment, since it's the only one that will actually deploy in that
  # run.
  - ${{ if eq(parameters.allowFirstEnvBranchDeploy, true) }}:
    - template: stages/tag-build.yaml
      parameters:
        tags:
          - GrafanaDashboards-${{ parameters.environments[0] }}
          - GrafanaDashboards-branch-deploy
  - ${{ else }}:
    - template: stages/tag-build.yaml
      parameters:
        tags:
          - ${{ each environment in parameters.environments }}:
            - GrafanaDashboards-${{ environment }}

  # 1. Validate dashboard JSON (always; no Azure connection needed)
  - stage: ValidateDashboards
    displayName: Validate Dashboard JSON
    jobs:
      - job: Validate
        displayName: Lint and validate dashboard files
        steps:
          - checkout: self

          - task: Bash@3
            displayName: Validate dashboard JSON files
            inputs:
              targetType: filePath
              filePath: grafana-dashboards/tests/validate-dashboards.sh

  # 2. Configure datasources in one env's Grafana (optional, one-off)
  - ${{ if eq(parameters.configureDatasources, true) }}:
    - template: stages/configure-grafana.yaml
      parameters:
        targetEnvironment: ${{ parameters.configureDatasourcesEnvironment }}
        allowBranchDeploy: ${{ and(eq(parameters.configureDatasourcesEnvironment, parameters.environments[0]), eq(parameters.allowFirstEnvBranchDeploy, true)) }}

  # 3. Deploy to the first environment
  - template: stages/deploy-grafana-dashboards.yaml
    parameters:
      targetEnvironment: ${{ parameters.environments[0] }}
      allowBranchDeploy: ${{ parameters.allowFirstEnvBranchDeploy }}

  # 4. Single manual approval gate: a human looks at the first environment
  #    before the pipeline carries on, unattended, through the rest.
  - template: stages/approve-grafana-gate.yaml
    parameters:
      afterEnvironment: ${{ parameters.environments[0] }}

  # 5. Deploy to every remaining environment in sequence. No further gates -
  #    once the first environment is approved the rest rolls out
  #    automatically. The stage right after the gate needs gateStageName so
  #    it still runs (preview-only) when the gate was Skipped on a non-main
  #    build; every stage after that just depends on the one before it.
  - ${{ each environment in parameters.environments }}:
    - ${{ if ne(environment, parameters.environments[0]) }}:
      - ${{ if eq(environment, parameters.environments[1]) }}:
        - template: stages/deploy-grafana-dashboards.yaml
          parameters:
            targetEnvironment: ${{ environment }}
            gateStageName: ApproveGrafanaGate
      - ${{ else }}:
        - template: stages/deploy-grafana-dashboards.yaml
          parameters:
            targetEnvironment: ${{ environment }}

