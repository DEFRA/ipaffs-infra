parameters:
  - name: referenceBranch
    type: string

  - name: mavenPomFile
    type: string
    default: 'pom.xml'

  - name: mvnGoals
    type: string
    default: verify jacoco:report

jobs:
  - job: SonarAnalyseJavaLibrary
    displayName: SonarQube Analysis
    variables:
      MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
      MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
    steps:
      # Full history: the scanner needs git blame for new-code attribution.
      - checkout: self
        fetchDepth: 0

      - task: DownloadSecureFile@1
        name: mavenSettings
        displayName: 'Download Maven Settings'
        inputs:
          secureFile: 'maven-settings.xml'

      - task: Cache@2
        displayName: Cache Maven local repo
        inputs:
          key: 'maven | "$(Agent.OS)" | **/pom.xml'
          restoreKeys: |
            maven | "$(Agent.OS)"
            maven
          path: $(MAVEN_CACHE_FOLDER)

      # Libraries are multi-module: classes and jacoco reports live under each
      # module's own target directory, so there is no single artifact for the
      # scanner to download. Rebuild here instead of publishing one.
      - task: Maven@4
        displayName: 'Build and Test'
        inputs:
          mavenPomFile: ${{ parameters.mavenPomFile }}
          mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '1.21'
          jdkArchitectureOption: 'x64'
          publishJUnitResults: false
          options: '--settings $(mavenSettings.secureFilePath)'
          goals: ${{ parameters.mvnGoals }}

      - template: /pipelines/steps/sonar-scan.yaml@ipaffs-infra
        parameters:
          referenceBranch: ${{ parameters.referenceBranch }}
          extraDockerArgs: '-v $(MAVEN_CACHE_FOLDER):/usr/.m2:ro'
          extraProperties: '-Dsonar.java.libraries=/usr/.m2 -Dsonar.java.test.libraries=/usr/.m2'
