parameters:
  name: nodeVersion
  type: string

jobs:
  - job: BuildNodeProject
    displayName: Build Node Project
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: ${{ parameters.nodeVersion }}
          addToPath: true
        displayName: Install Node and NPM and add to path

      - script: |
          npm --prefix ./service ci
          npm --prefix ./service run build
        displayName: 'Install dependencies and build'

      - script: |
          npm --prefix ./service run test-jenkins
        displayName: Run Mocha test suite

      - script: |
          rm -rf service/coverage
          npm --prefix ./service run posttest-jenkins

          # Replace the repo root to match sonar.tests/sonar.sources
          sed -i 's|path="test|path="service/test|g' service/coverage/unit.xml
          sed -i "s|${PWD}/service|service|g" service/coverage/lcov.info
        displayName: Generate coverage reports
        condition: succeeded()

      - task: PublishTestResults@2
        displayName: Publish Mocha test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: service/report.xml
          testRunTitle: Mocha Tests $(Build.BuildNumber)
          failTaskOnFailedTests: true

      - task: PublishPipelineArtifact@1
        displayName: Publish test coverage reports
        condition: succeeded()
        inputs:
          artifact: test-reports
          targetPath: '$(Build.SourcesDirectory)/service/coverage'

      - task: CopyFiles@2
        displayName: 'Copy public'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)/service/public'
          Contents: '**'
          TargetFolder: '$(Build.SourcesDirectory)/service_artifact/public'

      - task: PublishPipelineArtifact@1
        inputs:
          artifact: 'service'
          targetPath: '$(Build.SourcesDirectory)/service_artifact'
        displayName: Install dependencies and build

