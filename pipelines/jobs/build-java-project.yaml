parameters:
  - name: mvnGoals
    type: string
    default: verify jacoco:report package
  - name: mavenPomFile
    type: string
    default: 'service/pom.xml'
  - name: mavenSettingsFile
    type: string
    default: 'service/pom.xml'
  - name: jacocoFile
    type: string
    default: $(System.DefaultWorkingDirectory)/service/target/site/jacoco/jacoco.xml
  - name: srcPaths
    type: string
    default: $(System.DefaultWorkingDirectory)/service/src/main/java/
  - name: targetPath
    type: string
    default: $(Build.SourcesDirectory)/service/target
  - name: publishArtifact
    type: boolean
    default: true
  - name: sonarAnalysis
    type: boolean
    default: false
  - name: sonarReferenceBranch
    type: string
    default: main

jobs:
  - job: BuildJavaProject
    displayName: Build Java Project
    condition: and(not(failed()), not(canceled()), ne(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
      MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
    steps:
      # Full history: the scanner needs git blame for new-code attribution.
      - ${{ if eq(parameters.sonarAnalysis, true) }}:
        - checkout: self
          fetchDepth: 0

      - task: DownloadSecureFile@1
        name: mavenSettings
        displayName: 'Download Maven Settings'
        inputs:
          secureFile: 'maven-settings.xml'

      - task: Cache@2
        inputs:
          key: 'maven | "$(Agent.OS)" | **/pom.xml'
          restoreKeys: |
            maven | "$(Agent.OS)"
            maven
          path: $(MAVEN_CACHE_FOLDER)
        displayName: Cache Maven local repo

      - task: Maven@4
        displayName: 'Build and Test'
        inputs:
          mavenPomFile: ${{ parameters.mavenPomFile }}
          mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '1.21'
          jdkArchitectureOption: 'x64'
          publishJUnitResults: true
          testResultsFiles: '**/surefire-reports/TEST-*.xml'
          options: '--settings $(mavenSettings.secureFilePath)'
          goals: ${{ parameters.mvnGoals }}

      - task: PublishCodeCoverageResults@2
        displayName: 'Publish code coverage'
        inputs:
          summaryFileLocation: ${{ parameters.jacocoFile }}
          pathToSources: ${{ parameters.srcPaths }}

      - ${{ if eq(parameters.sonarAnalysis, true) }}:
        - template: /pipelines/steps/sonar-scan.yaml@ipaffs-infra
          parameters:
            referenceBranch: ${{ parameters.sonarReferenceBranch }}
            extraDockerArgs: '-v $(MAVEN_CACHE_FOLDER):/usr/.m2:ro'
            extraProperties: '-Dsonar.java.libraries=/usr/.m2 -Dsonar.java.test.libraries=/usr/.m2'

      - task: PublishPipelineArtifact@1
        displayName: Publish service artifact
        condition: and(succeeded(), eq(${{ parameters.publishArtifact }}, true))
        inputs:
          artifact: service
          targetPath: ${{ parameters.targetPath }}


