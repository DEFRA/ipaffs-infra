parameters:
  - name: environmentName
    type: string
  - name: applyOnBranch
    type: boolean
    default: false
  - name: dependsOn
    type: object
    default: []
  - name: jobVariables
    type: object
    default: []
  - name: jobName
    type: string
    default: Hooks

jobs:
  - deployment: ${{ parameters.jobName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if gt(length(parameters.jobVariables), 0) }}:
      variables: ${{ parameters.jobVariables }}
    displayName: Run deployment hooks
    environment:
      name: "${{ parameters.environmentName }}"
    # Runs on every branch; DRY_RUN decides whether hooks may change anything.
    condition: and(not(failed()), not(canceled()))
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: AzureCLI@2
              name: RunHooks
              displayName: Run hooks in scripts/hooks
              env:
                ENVIRONMENT: ${{ lower(parameters.environmentName) }}
                HOOKS_DIR: scripts/hooks
                SUBSCRIPTION_ID: $(subscriptionId)
                RESOURCE_GROUP_NAME: $(resourceGroupName)
                ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(parameters.applyOnBranch, true)) }}:
                  DRY_RUN: "false"
                ${{ else }}:
                  DRY_RUN: "true"
              inputs:
                azureSubscription: $(serviceConnection)
                scriptType: bash
                scriptPath: scripts/pipeline/run-hooks.sh
