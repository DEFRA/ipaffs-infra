parameters:
  - name: environmentName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: jobVariables
    type: object
    default: []
  - name: jobName
    type: string
    default: RunBicep
  - name: displayName
    type: string
    default: Run Bicep

jobs:
  - deployment: ${{ parameters.jobName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if gt(length(parameters.jobVariables), 0) }}:
      variables: ${{ parameters.jobVariables }}
    displayName: ${{ parameters.displayName }}
    environment:
      name: "${{ parameters.environmentName }}"
    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: self

            - task: AzureCLI@2
              displayName: WhatIf - Infrastructure to Classic
              inputs:
                azureSubscription: $(classicServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -x
                  az deployment group what-if \
                    --name "Infrastructure-$(Build.BuildId)" \
                    --subscription $(classicSubscriptionId) \
                    --resource-group $(classicResourceGroupName) \
                    --template-file bicep/45-infra-to-classic.bicep \
                    --parameters bicep/envs/${{ lower(parameters.environmentName) }}/45-infra-to-classic.bicepparam \
                    --parameters deployServicePrincipalObjectId="$(serviceConnectionPrincipalId)" \
                    --parameters grafanaManagedIdentityPrincipalId="$(grafanaManagedIdentityPrincipalId)"

            - task: AzureCLI@2
              displayName: Deploy - Infrastructure to Classic
              condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
              inputs:
                azureSubscription: $(classicServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -x
                  az deployment group create \
                    --name "Infrastructure-$(Build.BuildId)" \
                    --subscription $(classicSubscriptionId) \
                    --resource-group $(classicResourceGroupName) \
                    --template-file bicep/45-infra-to-classic.bicep \
                    --parameters bicep/envs/${{ lower(parameters.environmentName) }}/45-infra-to-classic.bicepparam \
                    --parameters deployServicePrincipalObjectId="$(serviceConnectionPrincipalId)" \
                    --parameters grafanaManagedIdentityPrincipalId="$(grafanaManagedIdentityPrincipalId)"

            - task: AzureCLI@2
              displayName: Wait for Deployment - Infrastructure to Classic
              condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
              inputs:
                azureSubscription: $(classicServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -x
                  az deployment group wait \
                    --name "Infrastructure-$(Build.BuildId)" \
                    --subscription $(classicSubscriptionId) \
                    --resource-group $(classicResourceGroupName) \
                    --created
