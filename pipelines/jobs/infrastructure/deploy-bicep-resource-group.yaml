parameters:
  - name: environmentName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: jobVariables
    type: object
    default: []
  - name: jobName
    type: string
    default: RunBicep
  - name: displayName
    type: string
    default: Run Bicep

jobs:
  - deployment: ${{ parameters.jobName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if gt(length(parameters.jobVariables), 0) }}:
      variables: ${{ parameters.jobVariables }}
    displayName: ${{ parameters.displayName }}
    environment:
      name: "${{ parameters.environmentName }}"
    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: self

            - task: Bash@3
              name: GenerateBicepParams
              displayName: Generate Bicep Params
              inputs:
                targetType: inline
                script: |
                  set -ex
                  cat <<- 'EOF' >'$(Build.SourcesDirectory)/bicep/10-resource-group-runtime.bicepparam'
                  using '10-resource-group.bicep'
                  extends 'envs/${{ lower(parameters.environmentName) }}/10-resource-group.bicepparam'
                  EOF
                  cat '$(Build.SourcesDirectory)/bicep/10-resource-group-runtime.bicepparam'

            - task: PublishPipelineArtifact@1
              displayName: Publish artifact
              inputs:
                artifactName: bicepparam-resource-group
                targetPath: $(Build.SourcesDirectory)/bicep/10-resource-group-runtime.bicepparam

            - task: AzureCLI@2
              displayName: WhatIf - Resource Group
              inputs:
                azureSubscription: $(serviceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -x
                  az deployment sub what-if \
                    --name "ResourceGroup-$(Build.BuildId)" \
                    --subscription $(subscriptionId) \
                    --location $(location) \
                    --template-file bicep/10-resource-group.bicep \
                    --parameters bicep/10-resource-group-runtime.bicepparam

            - task: AzureCLI@2
              displayName: Deploy - ResourceGroup
              condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
              inputs:
                azureSubscription: $(serviceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -x
                  az deployment sub create \
                    --name "ResourceGroup-$(Build.BuildId)" \
                    --subscription $(subscriptionId) \
                    --location $(location) \
                    --template-file bicep/10-resource-group.bicep \
                    --parameters bicep/10-resource-group-runtime.bicepparam
