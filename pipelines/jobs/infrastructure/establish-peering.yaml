parameters:
  - name: environmentName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: jobVariables
    type: object
    default: []
  - name: jobName
    type: string
    default: TriggerPeeringPipeline

jobs:
  - deployment: ${{ parameters.jobName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if gt(length(parameters.jobVariables), 0) }}:
      variables: ${{ parameters.jobVariables }}
    environment:
      name: "${{ parameters.environmentName }}"
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: Bash@3
              condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
              env:
                ADO_ORG_URL: $(System.CollectionUri)
                ADO_PROJECT: $(System.TeamProject)
                AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
                SUBSCRIPTION_NAME: $(subscriptionName)
                TENANT_ID: $(tenantId)
                VNET_NAME: $(vnetName)
              inputs:
                filePath: scripts/pipeline/trigger-peering-pipeline.sh
