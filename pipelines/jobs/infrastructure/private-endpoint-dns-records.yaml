parameters:
  - name: environmentName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: jobVariables
    type: object
    default: []

jobs:
  - deployment: ContainerRegistry
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if gt(length(parameters.jobVariables), 0) }}:
      variables: ${{ parameters.jobVariables }}
    displayName: Container Registry
    environment:
      name: "${{ parameters.environmentName }}"
    strategy:
      runOnce:
        deploy:
          steps:
            - template: /templates/steps/powershell.yaml@PipelineCommon
              parameters:
                azureResourceManagerConnection: AZR-MST-PrivateLinkDNS
                variables:
                  projectServiceConnection: $(serviceConnection)
                scriptsList:
                  - displayName: "Resolve Private Endpoint IPs"
                    serviceConnectionVariableName: projectServiceConnection
                    scriptPath: 'Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1@PipelineCommon'
                    scriptArguments: >
                      -ResourceGroupName '$(resourceGroupName)'
                      -ResourceName '$(acrName)'
                      -Subscription '$(subscriptionName)'

                  - displayName: "Set DNS records"
                    condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                    scriptPath: 'Set-PrivateDnsRecordSet.ps1@PipelineCommon'
                    scriptArguments: >
                      -UpdateAllDnsZones $true

  - deployment: KeyVault
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if gt(length(parameters.jobVariables), 0) }}:
      variables: ${{ parameters.jobVariables }}
    displayName: Key Vault
    environment:
      name: "${{ parameters.environmentName }}"
    strategy:
      runOnce:
        deploy:
          steps:
            - template: /templates/steps/powershell.yaml@PipelineCommon
              parameters:
                azureResourceManagerConnection: AZR-MST-PrivateLinkDNS
                variables:
                  projectServiceConnection: $(serviceConnection)
                scriptsList:
                  - displayName: "Resolve Private Endpoint IPs"
                    serviceConnectionVariableName: projectServiceConnection
                    scriptPath: 'Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1@PipelineCommon'
                    scriptArguments: >
                      -ResourceGroupName '$(resourceGroupName)'
                      -ResourceName '$(keyVaultName)'
                      -Subscription '$(subscriptionName)'

                  - displayName: "Set DNS records"
                    condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                    scriptPath: 'Set-PrivateDnsRecordSet.ps1@PipelineCommon'
                    scriptArguments: >
                      -UpdateAllDnsZones $true

            - ${{ if eq(parameters.environmentName, 'TST') }}:
              - template: /templates/steps/powershell.yaml@PipelineCommon
                parameters:
                  azureResourceManagerConnection: AZR-MST-PrivateLinkDNS
                  variables:
                    projectServiceConnection: $(serviceConnection)
                  scriptsList:
                    - displayName: "Resolve Private Endpoint IPs"
                      serviceConnectionVariableName: projectServiceConnection
                      scriptPath: 'Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1@PipelineCommon'
                      scriptArguments: >
                        -ResourceGroupName '$(resourceGroupName)'
                        -ResourceName '$(qaKeyVaultName)'
                        -Subscription '$(subscriptionName)'

                    - displayName: "Set DNS records"
                      condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                      scriptPath: 'Set-PrivateDnsRecordSet.ps1@PipelineCommon'
                      scriptArguments: >
                        -UpdateAllDnsZones $true

  - deployment: Redis
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    ${{ if gt(length(parameters.jobVariables), 0) }}:
      variables: ${{ parameters.jobVariables }}
    displayName: Redis
    environment:
      name: "${{ parameters.environmentName }}"
    strategy:
      runOnce:
        deploy:
          steps:
            - template: /templates/steps/powershell.yaml@PipelineCommon
              parameters:
                azureResourceManagerConnection: AZR-MST-PrivateLinkDNS
                variables:
                  projectServiceConnection: $(serviceConnection)
                scriptsList:
                  - displayName: "Resolve Private Endpoint IPs"
                    serviceConnectionVariableName: projectServiceConnection
                    scriptPath: 'Get-ResourcePrivateEndPointsDnsRecordsAsJson.ps1@PipelineCommon'
                    scriptArguments: >
                      -ResourceGroupName '$(resourceGroupName)'
                      -ResourceName '$(redisName)'
                      -Subscription '$(subscriptionName)'

                  - displayName: "Set DNS records"
                    condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                    scriptPath: 'Set-PrivateDnsRecordSet.ps1@PipelineCommon'
                    scriptArguments: >
                      -UpdateAllDnsZones $true

