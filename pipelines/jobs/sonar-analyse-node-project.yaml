parameters:
  - name: referenceBranch
    type: string

jobs:
  - job: SonarAnalyseNodeProject
    displayName: SonarQube Analysis
    steps:
      # Full history: the scanner needs git blame for new-code attribution.
      - checkout: self
        fetchDepth: 0

      # Reuse the Mocha coverage reports published by BuildNodeProject
      - task: DownloadPipelineArtifact@2
        displayName: Download test coverage reports
        continueOnError: true
        inputs:
          artifact: test-reports
          path: service/coverage

      - template: /pipelines/steps/sonar-scan.yaml@ipaffs-infra
        parameters:
          referenceBranch: ${{ parameters.referenceBranch }}
