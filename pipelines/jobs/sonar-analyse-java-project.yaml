parameters:
  - name: mvnGoals
    type: string

  - name: referenceBranch
    type: string

jobs:
  - job: SonarAnalyseJavaProject
    displayName: SonarQube Analysis
    variables:
      MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
      MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
    steps:
      # Full history: the scanner needs git blame for new-code attribution.
      - checkout: self
        fetchDepth: 0

      - task: Cache@2
        displayName: Cache Maven local repo
        inputs:
          key: 'maven | "$(Agent.OS)" | **/pom.xml'
          restoreKeys: |
            maven | "$(Agent.OS)"
            maven
          path: $(MAVEN_CACHE_FOLDER)

      - task: DownloadPipelineArtifact@2
        displayName: Download service build artifacts
        condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'))
        continueOnError: true
        inputs:
          artifact: service
          path: service/target

      # build-java-project.yaml skips main, so build here to produce the classes and coverage report the scanner needs.
      - task: Maven@4
        displayName: Build for analysis
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        continueOnError: true
        inputs:
          mavenPomFile: 'service/pom.xml'
          mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '1.21'
          jdkArchitectureOption: 'x64'
          publishJUnitResults: false
          options: '--s settings.xml'
          goals: ${{ parameters.mvnGoals }}

      - template: /pipelines/steps/sonar-scan.yaml@ipaffs-infra
        parameters:
          referenceBranch: ${{ parameters.referenceBranch }}
          extraDockerArgs: '-v $(MAVEN_CACHE_FOLDER):/usr/.m2:ro'
          extraProperties: '-Dsonar.java.libraries=/usr/.m2 -Dsonar.java.test.libraries=/usr/.m2'
