parameters:
  - name: referenceBranch
    type: string

jobs:
  - job: SonarAnalyseJavaProject
    displayName: SonarQube Analysis
    variables:
      MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
    steps:
      # Full history: the scanner needs git blame for new-code attribution.
      - checkout: self
        fetchDepth: 0

      - task: Cache@2
        displayName: Cache Maven local repo
        inputs:
          key: 'maven | "$(Agent.OS)" | **/pom.xml'
          restoreKeys: |
            maven | "$(Agent.OS)"
            maven
          path: $(MAVEN_CACHE_FOLDER)

      - task: DownloadPipelineArtifact@2
        displayName: Download service build artifacts
        continueOnError: true
        inputs:
          artifact: service
          path: service/target

      - template: /pipelines/steps/sonar-scan.yaml@ipaffs-infra
        parameters:
          referenceBranch: ${{ parameters.referenceBranch }}
          extraDockerArgs: '-v $(MAVEN_CACHE_FOLDER):/usr/.m2:ro'
          extraProperties: '-Dsonar.java.libraries=/usr/.m2 -Dsonar.java.test.libraries=/usr/.m2'
