parameters:
  - name: environmentName
    type: string

  - name: serviceConnection
    type: string
    default: ""

  - name: migrationsClientId
    type: string
    default: ""

  - name: namespace
    type: string

  - name: serviceClientId
    type: string
    default: ""

  - name: servicePrincipalName
    type: string
    default: ""

  - name: serviceName
    type: string

  - name: serviceVersion
    type: string

  - name: repository
    type: string
    default: self

  - name: helmfileAction
    type: string
    default: apply

  - name: helmfileDebug
    type: boolean
    default: false

  - name: helmfileSelector
    type: string
    default: ""

  - name: acrNameOverride
    type: string
    default: ""

  - name: acrLoginServerOverride
    type: string
    default: ""

jobs:
  - job: DeployChart
    displayName: Deploy Helm Charts
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
      - name: HELMFILE_TOOLCHAIN_DIRECTORY
        value: $(Pipeline.Workspace)/.helmfile-toolchain
      - name: HELMFILE_VERSION
        value: "1.1.9"
      - name: HELMFILE_SHA256
        value: ee71196bb12460905b8cbe0ef67b28db51ef681b777cc212d8c0956475b51905
      - name: HELM_DIFF_VERSION
        value: "3.13.1"
      - name: HELM_SECRETS_VERSION
        value: "4.6.5"
      - name: HELM_S3_VERSION
        value: "0.16.3"
      - name: HELM_GIT_VERSION
        value: "1.3.0"
      - name: HELMFILE_TOOLCHAIN_CACHE_RESTORED
        value: "false"

    steps:
      - checkout: ${{ parameters.repository }}
        workspaceRepo: true

      - task: Cache@2
        displayName: Restore Helmfile toolchain
        continueOnError: true
        inputs:
          key: '"helmfile-toolchain-v1" | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "helmfile-$(HELMFILE_VERSION)" | "archive-$(HELMFILE_SHA256)" | "diff-$(HELM_DIFF_VERSION)" | "secrets-$(HELM_SECRETS_VERSION)" | "s3-$(HELM_S3_VERSION)" | "helm-git-$(HELM_GIT_VERSION)"'
          path: $(HELMFILE_TOOLCHAIN_DIRECTORY)
          cacheHitVar: HELMFILE_TOOLCHAIN_CACHE_RESTORED

      - task: AzureCLI@2
        name: DeployHelmCharts
        displayName: Deploy Helm Charts
        env:
          ${{ if ne(parameters.acrNameOverride, '') }}:
            ACR_NAME: ${{ parameters.acrNameOverride }}
          ${{ else }}:
            ACR_NAME: $(acrName)
          ENVIRONMENT: ${{ lower(parameters.environmentName) }}
          AZURE_LOCATION: $(location)
          ${{ if ne(parameters.acrLoginServerOverride, '') }}:
            AZURE_CONTAINER_REGISTRY_HOST: ${{ parameters.acrLoginServerOverride }}
          ${{ else }}:
            AZURE_CONTAINER_REGISTRY_HOST: $(acrLoginServer)
          APPLICATIONINSIGHTS_CONNECTION_STRING: $(insightsConnectionString)
          APPLICATIONINSIGHTS_INSTRUMENTATION_STRING: $(insightsInstrumentationKey)
          AZURE_TENANT_ID: $(tenantId)
          AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ parameters.serviceClientId }}
          AZURE_MANAGED_IDENTITY_PRINCIPAL_NAME: ${{ parameters.servicePrincipalName }}
          AZURE_MANAGED_IDENTITY_MIGRATIONS_CLIENT_ID: ${{ parameters.migrationsClientId }}
          AZURE_MANAGED_IDENTITY_EXTERNAL_SECRETS_CLIENT_ID: $(externalSecretsClientId)
          AZURE_SQL_SERVER_NAME: $(sqlServerName)
          AZURE_SEARCH_SUBSCRIPTION_ID: $(searchServiceSubscriptionId)
          AZURE_SEARCH_RESOURCE_GROUP_NAME: $(searchServiceResourceGroupName)
          AZURE_SEARCH_SERVICE_NAME: $(searchServiceName)
          AZURE_STORAGE_ACCOUNT_NAME: $(storageAccountName)
          AZURE_SEARCH_MANAGED_IDENTITY_PRINCIPAL_NAME: $(searchServiceManagedIdentityPrincipalName)
          CONTAINER_IMAGE: "ipaffs/${{ parameters.serviceName }}:${{ parameters.serviceVersion }}"
          MIGRATIONS_IMAGE: "ipaffs/${{ parameters.serviceName }}-configuration:${{ parameters.serviceVersion }}"
          NAMESPACE: ${{ parameters.namespace }}
          HELMFILE_SELECTOR: "${{ parameters.helmfileSelector }}"
          SOURCE_REF: $(Build.SourceBranch)
          PIPELINE_WORKSPACE: $(Pipeline.Workspace)
          HELMFILE_TOOLCHAIN_DIRECTORY: $(HELMFILE_TOOLCHAIN_DIRECTORY)
          HELMFILE_VERSION: $(HELMFILE_VERSION)
          HELMFILE_SHA256: $(HELMFILE_SHA256)
          HELM_DIFF_VERSION: $(HELM_DIFF_VERSION)
          HELM_SECRETS_VERSION: $(HELM_SECRETS_VERSION)
          HELM_S3_VERSION: $(HELM_S3_VERSION)
          HELM_GIT_VERSION: $(HELM_GIT_VERSION)
          HELM_PLUGINS: $(HELMFILE_TOOLCHAIN_DIRECTORY)/plugins
          HELMFILE_TOOLCHAIN_CACHE_RESTORED: $(HELMFILE_TOOLCHAIN_CACHE_RESTORED)
          ${{ if eq(parameters.helmfileDebug, true) }}:
            HELMFILE_DEBUG: "true"
          ${{ else }}:
            HELMFILE_DEBUG: "false"
        inputs:
          azureSubscription: ${{ coalesce(parameters.serviceConnection, variables.serviceConnection) }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            echo "##[section]Authenticate with Azure"
            az aks install-cli --client-version v1.36.1 --kubelogin-version v0.2.18
            az aks get-credentials -n "$(kubernetesCluster)" -g "$(resourceGroupName)" --subscription "$(subscriptionName)"
            kubelogin convert-kubeconfig -l azurecli
            az acr login --name "${ACR_NAME}" --subscription "$(subscriptionName)"

            echo "##[section]Deploy Helm charts"
            if [[ "${SOURCE_REF}" == refs/tags/* ]]; then
              manifest_tag="${SOURCE_REF#refs/tags/}"
            elif [[ "${SOURCE_REF}" == refs/heads/RELEASE/* ]]; then
              manifest_tag="${SOURCE_REF#refs/heads/RELEASE/}"
            elif [[ "${SOURCE_REF}" == refs/heads/* ]]; then
              manifest_tag="${SOURCE_REF#refs/heads/}"
            else
              manifest_tag="${SOURCE_REF}"
            fi
            export MANIFEST_TAG="${manifest_tag}"

            helmfile_binary="${HELMFILE_TOOLCHAIN_DIRECTORY}/bin/helmfile"
            toolchain_marker="${HELMFILE_TOOLCHAIN_DIRECTORY}/.versions"
            expected_versions="$(printf 'helmfile=%s\ndiff=%s\nsecrets=%s\ns3=%s\nhelm-git=%s' \
              "${HELMFILE_VERSION}" \
              "${HELM_DIFF_VERSION}" \
              "${HELM_SECRETS_VERSION}" \
              "${HELM_S3_VERSION}" \
              "${HELM_GIT_VERSION}")"

            plugins_match_expected_versions() {
              local plugin_list
              plugin_list="$(helm plugin list 2>/dev/null)" || return 1

              [[ "$(awk '$1 == "diff" { print $2; exit }' <<< "${plugin_list}")" == "${HELM_DIFF_VERSION}" ]] &&
                [[ "$(awk '$1 == "secrets" { print $2; exit }' <<< "${plugin_list}")" == "${HELM_SECRETS_VERSION}" ]] &&
                [[ "$(awk '$1 == "s3" { print $2; exit }' <<< "${plugin_list}")" == "${HELM_S3_VERSION}" ]] &&
                [[ "$(awk '$1 == "helm-git" { print $2; exit }' <<< "${plugin_list}")" == "${HELM_GIT_VERSION}" ]]
            }

            toolchain_is_valid=false
            if [[ -x "${helmfile_binary}" ]] &&
              [[ -f "${toolchain_marker}" ]] &&
              [[ "$(< "${toolchain_marker}")" == "${expected_versions}" ]] &&
              [[ "$("${helmfile_binary}" --version 2>/dev/null)" == "helmfile version ${HELMFILE_VERSION}" ]] &&
              plugins_match_expected_versions; then
              toolchain_is_valid=true
            fi

            if [[ "${toolchain_is_valid}" == "true" ]]; then
              echo "Using cached Helmfile ${HELMFILE_VERSION} toolchain (cache restored: ${HELMFILE_TOOLCHAIN_CACHE_RESTORED})"
            else
              echo "Cached Helmfile toolchain is unavailable or invalid; installing pinned versions"

              expected_toolchain_directory="${PIPELINE_WORKSPACE}/.helmfile-toolchain"
              if [[ "${HELMFILE_TOOLCHAIN_DIRECTORY}" != "${expected_toolchain_directory}" ]]; then
                echo "Refusing to replace unexpected toolchain directory: ${HELMFILE_TOOLCHAIN_DIRECTORY}" >&2
                exit 1
              fi

              rm -rf -- "${HELMFILE_TOOLCHAIN_DIRECTORY}"
              mkdir -p "${HELMFILE_TOOLCHAIN_DIRECTORY}/bin" "${HELM_PLUGINS}"

              temporary_directory="$(mktemp -d)"
              trap 'rm -rf -- "${temporary_directory}"' EXIT

              helmfile_archive="helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
              helmfile_download="${temporary_directory}/${helmfile_archive}"
              curl \
                --fail \
                --location \
                --retry 3 \
                --show-error \
                --silent \
                --output "${helmfile_download}" \
                "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/${helmfile_archive}"
              printf '%s  %s\n' "${HELMFILE_SHA256}" "${helmfile_download}" | sha256sum --check -
              tar -xzf "${helmfile_download}" -C "${temporary_directory}" helmfile
              install -m 0755 "${temporary_directory}/helmfile" "${helmfile_binary}"
            fi

            "${helmfile_binary}" init --force

            if ! plugins_match_expected_versions; then
              echo "Helm plugins do not match the pinned toolchain versions" >&2
              helm plugin list >&2
              exit 1
            fi

            printf '%s\n' "${expected_versions}" > "${toolchain_marker}.tmp"
            mv "${toolchain_marker}.tmp" "${toolchain_marker}"

            selector_args=()
            if [[ -n "${HELMFILE_SELECTOR}" ]]; then
              selector_args=(--selector "${HELMFILE_SELECTOR}")
            fi

            "${helmfile_binary}" ${{ parameters.helmfileAction }} "${selector_args[@]}"
