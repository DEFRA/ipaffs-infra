parameters:
  - name: environmentName
    type: string

  - name: serviceConnection
    type: string
    default: ""

  - name: migrationsClientId
    type: string
    default: ""

  - name: namespace
    type: string

  - name: serviceClientId
    type: string
    default: ""

  - name: servicePrincipalName
    type: string
    default: ""

  - name: serviceName
    type: string

  - name: serviceVersion
    type: string

  - name: repository
    type: string
    default: self

  - name: helmfileAction
    type: string
    default: apply

  - name: helmfileDebug
    type: boolean
    default: false

  - name: helmfileSelector
    type: string
    default: ""

  - name: acrNameOverride
    type: string
    default: ""

  - name: acrLoginServerOverride
    type: string
    default: ""

jobs:
  - job: DeployChart
    displayName: Deploy Helm Charts
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
      - name: HELMFILE_TOOLCHAIN_DIRECTORY
        value: $(Pipeline.Workspace)/.helmfile-toolchain
      - name: HELMFILE_VERSION
        value: "1.1.9"
      - name: HELMFILE_SHA256
        value: ee71196bb12460905b8cbe0ef67b28db51ef681b777cc212d8c0956475b51905
      - name: HELMFILE_TOOLCHAIN_CACHE_RESTORED
        value: "false"

    steps:
      - checkout: ${{ parameters.repository }}
        workspaceRepo: true

      - task: Cache@2
        displayName: Restore Helmfile toolchain
        continueOnError: true
        inputs:
          key: '"helmfile-toolchain-v2" | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "helmfile-$(HELMFILE_VERSION)" | "archive-$(HELMFILE_SHA256)"'
          path: $(HELMFILE_TOOLCHAIN_DIRECTORY)
          cacheHitVar: HELMFILE_TOOLCHAIN_CACHE_RESTORED

      - bash: |
          set -euo pipefail

          rm -rf -- "${HELMFILE_TOOLCHAIN_DIRECTORY}"
          mkdir -p "${HELMFILE_TOOLCHAIN_DIRECTORY}/bin" "${HELM_PLUGINS}"
          helmfile_archive="$(Agent.TempDirectory)/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"

          curl --fail --location --retry 3 --show-error --silent \
            --output "${helmfile_archive}" \
            "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${HELMFILE_SHA256}" "${helmfile_archive}" | sha256sum --check -
          tar -xzf "${helmfile_archive}" -C "${HELMFILE_TOOLCHAIN_DIRECTORY}/bin" helmfile
          chmod +x "${HELMFILE_TOOLCHAIN_DIRECTORY}/bin/helmfile"
          "${HELMFILE_TOOLCHAIN_DIRECTORY}/bin/helmfile" init --force
        displayName: Install Helmfile toolchain
        condition: and(succeeded(), ne(variables['HELMFILE_TOOLCHAIN_CACHE_RESTORED'], 'true'))
        env:
          HELMFILE_TOOLCHAIN_DIRECTORY: $(HELMFILE_TOOLCHAIN_DIRECTORY)
          HELMFILE_VERSION: $(HELMFILE_VERSION)
          HELMFILE_SHA256: $(HELMFILE_SHA256)
          HELM_PLUGINS: $(HELMFILE_TOOLCHAIN_DIRECTORY)/plugins

      - task: AzureCLI@2
        name: DeployHelmCharts
        displayName: Deploy Helm Charts
        env:
          ${{ if ne(parameters.acrNameOverride, '') }}:
            ACR_NAME: ${{ parameters.acrNameOverride }}
          ${{ else }}:
            ACR_NAME: $(acrName)
          ENVIRONMENT: ${{ lower(parameters.environmentName) }}
          AZURE_LOCATION: $(location)
          ${{ if ne(parameters.acrLoginServerOverride, '') }}:
            AZURE_CONTAINER_REGISTRY_HOST: ${{ parameters.acrLoginServerOverride }}
          ${{ else }}:
            AZURE_CONTAINER_REGISTRY_HOST: $(acrLoginServer)
          APPLICATIONINSIGHTS_CONNECTION_STRING: $(insightsConnectionString)
          APPLICATIONINSIGHTS_INSTRUMENTATION_STRING: $(insightsInstrumentationKey)
          AZURE_TENANT_ID: $(tenantId)
          AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ parameters.serviceClientId }}
          AZURE_MANAGED_IDENTITY_PRINCIPAL_NAME: ${{ parameters.servicePrincipalName }}
          AZURE_MANAGED_IDENTITY_MIGRATIONS_CLIENT_ID: ${{ parameters.migrationsClientId }}
          AZURE_MANAGED_IDENTITY_EXTERNAL_SECRETS_CLIENT_ID: $(externalSecretsClientId)
          AZURE_SQL_SERVER_NAME: $(sqlServerName)
          AZURE_SEARCH_SUBSCRIPTION_ID: $(searchServiceSubscriptionId)
          AZURE_SEARCH_RESOURCE_GROUP_NAME: $(searchServiceResourceGroupName)
          AZURE_SEARCH_SERVICE_NAME: $(searchServiceName)
          AZURE_STORAGE_ACCOUNT_NAME: $(storageAccountName)
          AZURE_SEARCH_MANAGED_IDENTITY_PRINCIPAL_NAME: $(searchServiceManagedIdentityPrincipalName)
          CONTAINER_IMAGE: "ipaffs/${{ parameters.serviceName }}:${{ parameters.serviceVersion }}"
          MIGRATIONS_IMAGE: "ipaffs/${{ parameters.serviceName }}-configuration:${{ parameters.serviceVersion }}"
          NAMESPACE: ${{ parameters.namespace }}
          HELMFILE_SELECTOR: "${{ parameters.helmfileSelector }}"
          SOURCE_REF: $(Build.SourceBranch)
          HELMFILE_BINARY: $(HELMFILE_TOOLCHAIN_DIRECTORY)/bin/helmfile
          HELM_PLUGINS: $(HELMFILE_TOOLCHAIN_DIRECTORY)/plugins
          ${{ if eq(parameters.helmfileDebug, true) }}:
            HELMFILE_DEBUG: "true"
          ${{ else }}:
            HELMFILE_DEBUG: "false"
        inputs:
          azureSubscription: ${{ coalesce(parameters.serviceConnection, variables.serviceConnection) }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            echo "##[section]Authenticate with Azure"
            az aks install-cli --client-version v1.36.1 --kubelogin-version v0.2.18
            az aks get-credentials -n "$(kubernetesCluster)" -g "$(resourceGroupName)" --subscription "$(subscriptionName)"
            kubelogin convert-kubeconfig -l azurecli
            az acr login --name "${ACR_NAME}" --subscription "$(subscriptionName)"

            echo "##[section]Deploy Helm charts"
            if [[ "${SOURCE_REF}" == refs/tags/* ]]; then
              manifest_tag="${SOURCE_REF#refs/tags/}"
            elif [[ "${SOURCE_REF}" == refs/heads/RELEASE/* ]]; then
              manifest_tag="${SOURCE_REF#refs/heads/RELEASE/}"
            elif [[ "${SOURCE_REF}" == refs/heads/* ]]; then
              manifest_tag="${SOURCE_REF#refs/heads/}"
            else
              manifest_tag="${SOURCE_REF}"
            fi
            export MANIFEST_TAG="${manifest_tag}"

            selector_args=()
            if [[ -n "${HELMFILE_SELECTOR}" ]]; then
              selector_args=(--selector "${HELMFILE_SELECTOR}")
            fi

            "${HELMFILE_BINARY}" ${{ parameters.helmfileAction }} "${selector_args[@]}"
