---
# One-off probe: can an ADO-hosted Renovate run with no PATs?
#   1. GitHub  — the DEFRA service connection (Azure Pipelines GitHub App)
#                installation token: which repos it covers, and whether it
#                can push a branch and open a PR.
#   2. Feed    — System.AccessToken against an Azure Artifacts feed.
# Safe by default: read-only checks unless createTestPr=true, in which case
# it opens a DRAFT PR on the target repo, then closes it and deletes the branch.
trigger: none
pr: none

pool:
  name: DEFRA-COMMON-ubuntu2204-SSV5

parameters:
  - name: createTestPr
    displayName: Push a branch + open (then close) a draft PR on the target repo
    type: boolean
    default: false
  - name: feedIndexUrl
    displayName: Azure Artifacts feed URL to probe with System.AccessToken
    type: string
    default: https://pkgs.dev.azure.com/defragovuk/DEFRA-EUTD-IPAFFS/_packaging/DEFRA-EUTD-IPAFFS/nuget/v3/index.json

resources:
  repositories:
    - repository: target
      type: github
      endpoint: DEFRA
      name: DEFRA/ipaffs-countries-microservice

variables:
  targetRepo: DEFRA/ipaffs-countries-microservice

jobs:
  - job: Probe
    steps:
      - checkout: target
        persistCredentials: true
        clean: true

      - task: Bash@3
        name: Token
        displayName: Extract GitHub App installation token from checkout
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)
          script: |
            set -euo pipefail
            hdr=$(git config --get-regexp 'http\..*\.extraheader' | head -1 | sed -E 's/^[^ ]+ //')
            if [ -z "$hdr" ]; then echo "No persisted extraheader found" >&2; exit 1; fi
            scheme=$(echo "$hdr" | awk '{print tolower($2)}')
            cred=$(echo "$hdr" | awk '{print $3}')
            case "$scheme" in
              basic)  tok=$(echo "$cred" | base64 -d | sed -E 's/^[^:]*://') ;;
              bearer) tok="$cred" ;;
              *) echo "Unexpected auth scheme: $scheme" >&2; exit 1 ;;
            esac
            echo "##vso[task.setsecret]$tok"
            echo "##vso[task.setvariable variable=ghToken;issecret=true]$tok"
            echo "Token extracted (scheme: $scheme, length: ${#tok})"

      - task: Bash@3
        displayName: GitHub — token scope and read access
        env:
          GH_TOKEN: $(ghToken)
        inputs:
          targetType: inline
          script: |
            set -uo pipefail
            api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
            echo "== Repos this installation token can access (scope check)"
            api "https://api.github.com/installation/repositories?per_page=100" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print("total_count:", d.get("total_count")); [print(" -", r["full_name"]) for r in d.get("repositories",[])[:20]]' \
              || echo "Could not list installation repositories (token may not be an installation token)"
            echo "== Read PRs on $(targetRepo)"
            api -o /dev/null -w "HTTP %{http_code}\n" "https://api.github.com/repos/$(targetRepo)/pulls?per_page=1"
            echo "== Read a repo NOT declared as a resource (ipaffs-notification-microservice)"
            api -o /dev/null -w "HTTP %{http_code}\n" "https://api.github.com/repos/DEFRA/ipaffs-notification-microservice/pulls?per_page=1"
            echo "== Rate limit"
            api https://api.github.com/rate_limit | python3 -c 'import sys,json; print(json.load(sys.stdin)["resources"]["core"])'

      - ${{ if eq(parameters.createTestPr, true) }}:
          - task: Bash@3
            displayName: GitHub — push branch, open draft PR, then clean up
            env:
              GH_TOKEN: $(ghToken)
            inputs:
              targetType: inline
              workingDirectory: $(Build.SourcesDirectory)
              script: |
                set -euo pipefail
                api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
                branch="renovate-probe/$(Build.BuildId)"
                base=$(api "https://api.github.com/repos/$(targetRepo)" | python3 -c 'import sys,json; print(json.load(sys.stdin)["default_branch"])')
                git config user.name "IPAFFS CI Bot"
                git config user.email "ipaffs-ci-bot@defra.gov.uk"
                git checkout -b "$branch" "origin/$base"
                git commit --allow-empty -m "Renovate probe (safe to ignore)"
                git push origin "$branch"
                echo "== Branch push: OK"
                resp=$(api -X POST "https://api.github.com/repos/$(targetRepo)/pulls" \
                  -d "{\"title\":\"Renovate probe (auto-closing)\",\"head\":\"$branch\",\"base\":\"$base\",\"draft\":true,\"body\":\"Automated permission probe from ADO; closes itself.\"}")
                num=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("number",""))')
                if [ -n "$num" ]; then
                  echo "== PR create: OK (#$num)"
                  api -X PATCH "https://api.github.com/repos/$(targetRepo)/pulls/$num" -d '{"state":"closed"}' -o /dev/null -w "== PR close: HTTP %{http_code}\n"
                else
                  echo "== PR create: FAILED"; echo "$resp" | head -c 500; echo
                fi
                git push origin --delete "$branch" && echo "== Branch delete: OK"
                [ -n "$num" ]

      - task: Bash@3
        displayName: Feed — System.AccessToken access
        env:
          ADO_TOKEN: $(System.AccessToken)
        inputs:
          targetType: inline
          script: |
            set -uo pipefail
            curl -sS -u "build:$ADO_TOKEN" -o /dev/null -w "Feed ${{ parameters.feedIndexUrl }} -> HTTP %{http_code}\n" "${{ parameters.feedIndexUrl }}"
