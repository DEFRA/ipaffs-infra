parameters:
  - name: environmentName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: deploymentVariables
    type: object
    default: {}

stages:
  - stage: PrivateLinkDNSRecords
    displayName: Set Private Endpoint DNS Records
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
      - template: /templates/vars/common.yaml@PipelineCommon
      - template: /templates/vars/regional/northeurope.yaml@PipelineCommon
      - ${{ each variable in parameters.deploymentVariables }}:
        - name: ${{ variable.key }}
          value: ${{ variable.value }}
    jobs:
      - template: ../jobs/infrastructure/private-endpoint-dns-records.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
