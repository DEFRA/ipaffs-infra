parameters:
  - name: stagePrefix
    type: string
    default: ''

  - name: allowTaggedDeployments
    type: boolean
    default: false

  - name: environmentName
    type: string

  - name: dependsOn
    type: object
    default: []
  - name: deploymentVariables
    type: object
    default: {}

stages:
  - stage: ${{ parameters.stagePrefix }}PrivateLink
    displayName: Private Link
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
      - ${{ each variable in parameters.deploymentVariables }}:
        - name: ${{ variable.key }}
          value: ${{ variable.value }}
    jobs:
      - deployment: RunBicep
        displayName: Run Bicep
        environment:
          name: "${{ parameters.environmentName }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self

                - task: Bash@3
                  name: GenerateBicepParams
                  displayName: Generate Bicep Params
                  env:
                    BICEP_PRIVATE_ENDPOINTS_SUBNET_ID: $(privateEndpointsSubnetId)
                    BICEP_PRIVATE_ENDPOINTS_SUBNET_NAME: $(privateEndpointsSubnetName)
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      python3 scripts/pipeline/infrastructure_parameters.py \
                        --component privatelink \
                        --environment ${{ parameters.environmentName }} \
                        --output "$(Build.SourcesDirectory)/bicep/50-privatelink-runtime.bicepparam"

                - task: PublishPipelineArtifact@1
                  displayName: Publish artifact
                  inputs:
                    artifactName: ${{ parameters.stagePrefix }}bicepparam-privatelink
                    targetPath: $(Build.SourcesDirectory)/bicep/50-privatelink-runtime.bicepparam

                - task: AzureCLI@2
                  displayName: WhatIf - PrivateLink
                  env:
                    AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      bash scripts/pipeline/ensure-bicep-version.sh
                      set -x
                      az deployment group what-if \
                        --name "PrivateLink-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --resource-group $(resourceGroupName) \
                        --template-file bicep/50-privatelink.bicep \
                        --parameters bicep/50-privatelink-runtime.bicepparam

                - task: AzureCLI@2
                  displayName: Deploy - PrivateLink
                  condition: and(not(failed()), not(canceled()), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), and(${{ parameters.allowTaggedDeployments }}, startsWith(variables['Build.SourceBranch'], 'refs/tags/'))))
                  env:
                    AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      bash scripts/pipeline/ensure-bicep-version.sh
                      set -x
                      az deployment group create \
                        --name "PrivateLink-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --resource-group $(resourceGroupName) \
                        --template-file bicep/50-privatelink.bicep \
                        --parameters bicep/50-privatelink-runtime.bicepparam

                - task: AzureCLI@2
                  displayName: Wait for Deployment - PrivateLink
                  condition: and(not(failed()), not(canceled()), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), and(${{ parameters.allowTaggedDeployments }}, startsWith(variables['Build.SourceBranch'], 'refs/tags/'))))
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      az deployment group wait \
                        --name "PrivateLink-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --resource-group $(resourceGroupName) \
                        --created
