parameters:
  - name: environmentName
    type: string

  - name: dependsOn
    type: object
    default: []
  - name: deploymentVariables
    type: object
    default: {}

stages:
  - stage: DeployNetwork
    displayName: Deploy Network
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
      - ${{ each variable in parameters.deploymentVariables }}:
        - name: ${{ variable.key }}
          value: ${{ variable.value }}
    jobs:
      - deployment: RunBicep
        displayName: Run Bicep
        environment:
          name: "${{ parameters.environmentName }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self

                - task: AzureCLI@2
                  displayName: WhatIf - Network
                  env:
                    AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      bash scripts/pipeline/ensure-bicep-version.sh
                      existing_network_security_group_names="$(az network nsg list \
                        --subscription "$(subscriptionId)" \
                        --resource-group "$(resourceGroupName)" \
                        --query '[].name' --output json --only-show-errors)"
                      EXISTING_NETWORK_SECURITY_GROUP_NAMES="$existing_network_security_group_names" python3 - <<'PY_NAMES'
                      import json
                      import os
                      import sys
                      sys.path.insert(0, 'scripts/pipeline')
                      from infrastructure_parameters import validate_existing_network_security_group_names
                      try:
                          validate_existing_network_security_group_names(json.loads(os.environ['EXISTING_NETWORK_SECURITY_GROUP_NAMES']))
                      except (TypeError, ValueError):
                          print('Existing NSG discovery returned invalid names; refusing to plan or deploy Network.', file=sys.stderr)
                          raise SystemExit(1)
                      PY_NAMES
                      az deployment group what-if \
                        --name "Network-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --resource-group $(resourceGroupName) \
                        --template-file bicep/20-network.bicep \
                        --parameters bicep/envs/${{ lower(parameters.environmentName) }}/20-network.bicepparam \
                        existingNetworkSecurityGroupNames="$existing_network_security_group_names"

                - task: AzureCLI@2
                  displayName: Deploy - Network
                  condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                  env:
                    AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      bash scripts/pipeline/ensure-bicep-version.sh
                      existing_network_security_group_names="$(az network nsg list \
                        --subscription "$(subscriptionId)" \
                        --resource-group "$(resourceGroupName)" \
                        --query '[].name' --output json --only-show-errors)"
                      EXISTING_NETWORK_SECURITY_GROUP_NAMES="$existing_network_security_group_names" python3 - <<'PY_NAMES'
                      import json
                      import os
                      import sys
                      sys.path.insert(0, 'scripts/pipeline')
                      from infrastructure_parameters import validate_existing_network_security_group_names
                      try:
                          validate_existing_network_security_group_names(json.loads(os.environ['EXISTING_NETWORK_SECURITY_GROUP_NAMES']))
                      except (TypeError, ValueError):
                          print('Existing NSG discovery returned invalid names; refusing to plan or deploy Network.', file=sys.stderr)
                          raise SystemExit(1)
                      PY_NAMES
                      az deployment group create \
                        --name "Network-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --resource-group $(resourceGroupName) \
                        --template-file bicep/20-network.bicep \
                        --parameters bicep/envs/${{ lower(parameters.environmentName) }}/20-network.bicepparam \
                        existingNetworkSecurityGroupNames="$existing_network_security_group_names"

                - task: AzureCLI@2
                  displayName: Wait for Deployment - Network
                  condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      az deployment group wait \
                        --name "Network-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --resource-group $(resourceGroupName) \
                        --created

                - task: AzureCLI@2
                  name: NetworkOutputs
                  displayName: Network outputs
                  condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                  env:
                    ADO_ORG_URL: $(System.CollectionUri)
                    ADO_PROJECT: $(System.TeamProject)
                    ADO_GROUP_NAME: ${{ parameters.environmentName }}
                    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
                    DEPLOYMENT_NAME: Network-$(Build.BuildId)
                    RESOURCE_GROUP: $(resourceGroupName)
                    SUBSCRIPTION_ID: $(subscriptionId)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      python3 scripts/pipeline/sync-deployment-outputs.py \
                        --emit-output=aksApiServerSubnetId \
                        --emit-output=aksApiServerSubnetName \
                        --emit-output=aksSystemNodesSubnetId \
                        --emit-output=aksSystemNodesSubnetName \
                        --emit-output=aksUserNodesSubnetId \
                        --emit-output=aksUserNodesSubnetName \
                        --emit-output=appGatewayForContainersSubnetId \
                        --emit-output=appGatewayForContainersSubnetName \
                        --emit-output=privateEndpointsSubnetId \
                        --emit-output=privateEndpointsSubnetName \
                        --emit-output=vnetName \
                        aksApiServerSubnetId=aksApiServerSubnetId \
                        aksApiServerSubnetName=aksApiServerSubnetName \
                        aksSystemNodesSubnetId=aksSystemNodesSubnetId \
                        aksSystemNodesSubnetName=aksSystemNodesSubnetName \
                        aksUserNodesSubnetId=aksUserNodesSubnetId \
                        aksUserNodesSubnetName=aksUserNodesSubnetName \
                        appGatewayForContainersSubnetId=appGatewayForContainersSubnetId \
                        appGatewayForContainersSubnetName=appGatewayForContainersSubnetName \
                        privateEndpointsSubnetId=privateEndpointsSubnetId \
                        privateEndpointsSubnetName=privateEndpointsSubnetName \
                        vnetName=vnetName \
                        vnetResourceId=vnetResourceId
