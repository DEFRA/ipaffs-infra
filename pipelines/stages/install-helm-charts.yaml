# Compatibility handoff for existing pipeline entrypoints. Shared cluster charts
# are installed only by ipaffs-manifest; this stage never changes Kubernetes.
parameters:
  - name: environmentName
    type: string
  # Retained for callers of the previous installer. Infrastructure outputs are
  # consumed by the manifest deployment rather than by this stage.
  - name: infrastructureDeploymentName
    type: string
    default: ''
  - name: tagBuild
    type: boolean
    default: false

stages:
  - stage: DeployHelmCharts
    displayName: Platform charts owned by ipaffs-manifest
    jobs:
      - job: ManifestOwnsPlatform
        displayName: Report platform deployment ownership
        steps:
          - checkout: none

          - ${{ if parameters.tagBuild }}:
            - bash: echo "##vso[build.addbuildtag]Environment-${{ parameters.environmentName }}"
              displayName: Tag environment
              condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

          - bash: |
              echo "Shared platform charts for ${{ parameters.environmentName }} are owned by DEFRA/ipaffs-manifest."
              echo "Use manifest master for DEV, or an approved numeric release tag for TST, PRE or PRD."
              echo "Feature branches and FTR only plan platform changes. No charts were changed by this stage."
            displayName: Report manifest platform handoff
