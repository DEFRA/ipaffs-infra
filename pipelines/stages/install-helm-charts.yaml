parameters:
  - name: environmentName
    type: string
  - name: infrastructureDeploymentName
    type: string
    default: ''

stages:
  - stage: DeployHelmCharts
    displayName: Deploy Helm Charts
    jobs:
      - deployment: DeployHelm
        displayName: Deploy with Helm
        environment:
          name: "${{ parameters.environmentName }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  name: AuthenticateAzure
                  displayName: Authenticate with Azure
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      cluster_version=$(az aks show --name "$(kubernetesCluster)" --resource-group "$(resourceGroupName)" --subscription "$(subscriptionName)" --query currentKubernetesVersion -o tsv)
                      if [[ ! "$cluster_version" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
                        echo 'Could not determine the current AKS version for a compatible kubectl client.'
                        exit 1
                      fi
                      az aks install-cli --client-version "v$cluster_version" --kubelogin-version v0.2.18
                      az aks get-credentials -n "$(kubernetesCluster)" -g "$(resourceGroupName)" --subscription "$(subscriptionName)"
                      kubelogin convert-kubeconfig -l azurecli
                      az acr login --name "$(acrName)" --subscription "$(subscriptionName)" || az acr check-health -n "$(acrName)" --yes

                - task: AzureCLI@2
                  displayName: Helm Install - alb-controller
                  env:
                    ALB_CONTROLLER_CLIENT_ID: $(albControllerClientId)
                    HELM_DRY_RUN: $(helmDryRun)
                    INFRASTRUCTURE_DEPLOYMENT_NAME: ${{ parameters.infrastructureDeploymentName }}
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # Library updates are not guaranteed to refresh within the same run.
                      # The infrastructure pipeline supplies its deployment; standalone installs use the Library.
                      controller_client_id="$ALB_CONTROLLER_CLIENT_ID"
                      if [[ -z "$HELM_DRY_RUN" && -n "$INFRASTRUCTURE_DEPLOYMENT_NAME" ]]; then
                        controller_client_id=$(az deployment group show \
                          --name "$INFRASTRUCTURE_DEPLOYMENT_NAME" \
                          --subscription "$(subscriptionId)" \
                          --resource-group "$(resourceGroupName)" \
                          --query properties.outputs.albControllerClientId.value -o tsv)
                      fi
                      if [[ ! "$controller_client_id" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
                        if [[ -n "$HELM_DRY_RUN" ]]; then
                          echo 'Rendering only: the ALB identity has not been deployed yet.'
                          controller_client_id=00000000-0000-0000-0000-000000000000
                        else
                          echo 'Missing albControllerClientId. Deploy infrastructure and import the ALB images before running the standalone Helm pipeline.'
                          exit 1
                        fi
                      fi

                      # Existing Gateway API/ALB CRDs require the expected Helm release and controller.
                      # Check installation identity, not version, so upgrades and rollbacks remain possible.
                      gateway_crds=$(kubectl get crds -o json | jq -r '.items[] | select(.spec.group == "gateway.networking.k8s.io" or .spec.group == "alb.networking.azure.io") | .metadata.name')
                      if [[ -n "$gateway_crds" ]]; then
                        helm list --namespace azure-alb-system --all --filter '^alb-controller$' --output json | \
                          jq -e '
                            length == 1 and
                            .[0].name == "alb-controller" and
                            .[0].namespace == "azure-alb-system" and
                            (.[0].chart | startswith("alb-controller-"))
                          ' > /dev/null || {
                            echo 'Gateway API/ALB CRDs already exist without the expected ALB release. Confirm ownership before proceeding.'
                            echo "$gateway_crds"
                            exit 1
                          }
                        kubectl get deployment alb-controller --namespace azure-alb-system -o json | jq -e '
                          .metadata.labels["app.kubernetes.io/managed-by"] == "Helm" and
                          .metadata.annotations["meta.helm.sh/release-name"] == "alb-controller" and
                          .metadata.annotations["meta.helm.sh/release-namespace"] == "azure-alb-system" and
                          .spec.template.spec.serviceAccountName == "alb-controller-sa"
                        ' > /dev/null
                      fi

                      helm upgrade \
                        --install \
                        --debug \
                        --namespace azure-alb-system \
                        --create-namespace \
                        --dependency-update \
                        --wait \
                        --timeout 10m \
                        $(helmDryRun) \
                        --values helm-charts/alb-controller-values.yaml \
                        --set-string "albController.podIdentity.clientID=$controller_client_id" \
                        --set-string "albController.image.registry=$(acrLoginServer)" \
                        alb-controller oci://mcr.microsoft.com/application-lb/charts/alb-controller \
                        --version "$(albControllerVersion)"

                      if [[ -z "$HELM_DRY_RUN" ]]; then
                        kubectl wait --for=condition=Accepted gatewayclass/azure-alb-external --timeout=300s
                        kubectl get pods --namespace azure-alb-system
                      fi

                - task: AzureCLI@2
                  displayName: Helm Install - cert-manager
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace cert-manager \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --values helm-charts/cert-manager-values.yaml \
                        --set image.registry="$(acrLoginServer)" \
                        --set cainjector.image.registry="$(acrLoginServer)" \
                        --set startupapicheck.image.registry="$(acrLoginServer)" \
                        --set webhook.image.registry="$(acrLoginServer)" \
                        cert-manager "oci://quay.io/jetstack/charts/cert-manager" \
                        --version 1.19.1

                - task: AzureCLI@2
                  displayName: Helm Install - azure-service-operator-config
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace azureserviceoperator-system \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --values helm-charts/azure-service-operator-config-values.yaml \
                        --set azureSubscriptionID="$(subscriptionId)" \
                        --set azureTenantID="$(tenantId)" \
                        --set azureClientID="$(azureServiceOperatorClientId)" \
                        azure-service-operator-config ./helm-charts/azure-service-operator-config

                - task: AzureCLI@2
                  displayName: Helm Install - azure-service-operator
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace azureserviceoperator-system \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --values helm-charts/azure-service-operator-values.yaml \
                        --set image.repositoryBase="$(acrLoginServer)/k8s/azureserviceoperator" \
                        azure-service-operator azure-service-operator \
                        --repo "https://raw.githubusercontent.com/Azure/azure-service-operator/main/v2/charts" \
                        --version 2.16.0

                - task: AzureCLI@2
                  displayName: Helm Install - external-secrets
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace external-secrets \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --values helm-charts/external-secrets-values.yaml \
                        --set azure.vaultUrl="$(keyVaultUrl)" \
                        --set azure.tenantId="$(tenantId)" \
                        --set azure.identityId="$(externalSecretsClientId)" \
                        --set serviceAccount.annotations.azure\\.workload\\.identity/client-id="$(externalSecretsClientId)" \
                        --set image.repository="$(acrLoginServer)/external-secrets/external-secrets" \
                        --set webhook.image.repository="$(acrLoginServer)/external-secrets/external-secrets" \
                        --set certController.image.repository="$(acrLoginServer)/external-secrets/external-secrets" \
                        external-secrets external-secrets \
                        --repo "https://charts.external-secrets.io" \
                        --version v1.1.1

                - task: AzureCLI@2
                  displayName: Helm Install - external-secrets-azure
                  env:
                    BOOTSTRAP_CCOE_SECRET_STORE_NAME: $(bootstrapCcoeSecretStoreName)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      additional_store_args=()
                      if [[ -n "${BOOTSTRAP_CCOE_SECRET_STORE_NAME}" ]]; then
                        ccoe_vault_url="https://${BOOTSTRAP_CCOE_SECRET_STORE_NAME,,}.vault.azure.net/"
                        ccoe_store_name="external-secrets-azure-ccoe"

                        additional_store_args+=(--set-string "additionalSecretStores.${ccoe_store_name}.vaultUrl=${ccoe_vault_url}")
                        additional_store_args+=(--set-string "additionalSecretStores.${ccoe_store_name}.tenantId=$(tenantId)")
                        additional_store_args+=(--set-string "additionalSecretStores.${ccoe_store_name}.identityId=$(externalSecretsClientId)")
                        additional_store_args+=(--set-string "additionalSecretStores.${ccoe_store_name}.serviceAccountRef.name=external-secrets")
                        additional_store_args+=(--set-string "additionalSecretStores.${ccoe_store_name}.serviceAccountRef.namespace=external-secrets")
                      fi

                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace external-secrets \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --values helm-charts/external-secrets-values.yaml \
                        --set azure.vaultUrl="$(keyVaultUrl)" \
                        --set azure.tenantId="$(tenantId)" \
                        --set azure.identityId="$(externalSecretsClientId)" \
                        --set azure.serviceAccountRef.name=external-secrets \
                        --set azure.serviceAccountRef.namespace=external-secrets \
                        "${additional_store_args[@]}" \
                        external-secrets-azure ./helm-charts/external-secrets-azure

                - task: AzureCLI@2
                  displayName: Helm Install - reloader
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace reloader \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --values helm-charts/reloader-values.yaml \
                        --set image.repository="$(acrLoginServer)/stakater/reloader" \
                        reloader reloader \
                        --repo "https://stakater.github.io/stakater-charts" \
                        --version 2.2.11

                - task: AzureCLI@2
                  displayName: Helm Install - keda
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace keda \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --values helm-charts/keda-values.yaml \
                        keda keda \
                        --repo "https://kedacore.github.io/charts"

                - task: AzureCLI@2
                  displayName: Helm Install - defra-certs
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace defra-certs \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        defra-certs ./helm-charts/defra-certs

                # See https://learn.microsoft.com/en-us/azure/aks/app-routing-nginx-configuration?pivots=nginx-ingress-controller
                - task: AzureCLI@2
                  displayName: Helm Install - app-routing-controller
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace app-routing-namespace \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        app-routing-controller ./helm-charts/app-routing-controller

                - task: AzureCLI@2
                  displayName: Helm Install - ms-identity-redirect-handler
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace ms-identity-redirect-handler \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        --set environment="${{ lower(parameters.environmentName) }}" \
                        --set redirectorDomain="$(redirectorDomain)" \
                        ms-identity-redirect-handler ./helm-charts/ms-identity-redirect-handler

                - task: AzureCLI@2
                  displayName: Helm Install - ama-metrics-settings
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      helm upgrade \
                        --install \
                        --debug \
                        --namespace kube-system \
                        --create-namespace \
                        --dependency-update \
                        --timeout 2m \
                        $(helmDryRun) \
                        ama-metrics-settings ./helm-charts/ama-metrics-settings
                      kubectl rollout restart deployment ama-metrics-ksm -n kube-system
                      kubectl rollout status deployment ama-metrics-ksm -n kube-system --timeout=2m

