# Shared platform tail for full bootstrap and standalone platform maintenance.
parameters:
  - name: environmentName
    type: string
  - name: infrastructureDeploymentName
    type: string
    default: ''
  - name: importImages
    type: boolean
    default: true
  - name: tagBuild
    type: boolean
    default: false

stages:
  - ${{ if parameters.importImages }}:
    - template: import-acr-artifacts.yaml
      parameters:
        environmentName: ${{ parameters.environmentName }}

  - template: install-helm-charts.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}
      infrastructureDeploymentName: ${{ parameters.infrastructureDeploymentName }}
      tagBuild: ${{ parameters.tagBuild }}

  - template: deploy-bicep-privatelink.yaml
    parameters:
      environmentName: ${{ parameters.environmentName }}
