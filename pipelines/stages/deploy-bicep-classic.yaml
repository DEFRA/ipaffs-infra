# Note: For hybrid deployments to classic SND environment, we will also need variables from the DEV library
# group - these should be passed in from the parent pipeline definition, with the classicEnvironmentName parameter
# for this stage template overridden to SND. This will achieve the necessary variable precedence.
# See https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables?view=azure-devops&tabs=yaml%2Cbatch#expansion-of-variables
parameters:
  - name: stagePrefix
    type: string
    default: ''

  - name: allowTaggedDeployments
    type: boolean
    default: false

  - name: environmentName
    type: string
  - name: classicEnvironmentName
    type: string

  - name: dependsOn
    type: object
    default: []
  - name: deploymentVariables
    type: object
    default: {}

stages:
  - stage: ${{ parameters.stagePrefix }}DeployClassic
    displayName: Deploy Classic
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: "${{ parameters.classicEnvironmentName }}"
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.classicEnvironmentName) }}.yaml"
      # Main pipelines supply the modern SQL admin group from access validation.
      # The fallback keeps this stage usable without an explicit output dependency.
      - name: parameterSqlAdminGroupId
        value: $(sqlAdminGroupId)
      - name: parameterSqlAdminGroupName
        value: $(sqlAdminGroupName)
      - ${{ each variable in parameters.deploymentVariables }}:
        - name: ${{ variable.key }}
          value: ${{ variable.value }}
    jobs:
      - deployment: RunBicep
        displayName: Run Bicep
        environment:
          name: "${{ parameters.classicEnvironmentName }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self

                - task: Bash@3
                  name: GenerateBicepParams
                  displayName: Generate Bicep Params
                  env:
                    BICEP_PARAMETER_SQL_ADMIN_GROUP_ID: $(parameterSqlAdminGroupId)
                    BICEP_PARAMETER_SQL_ADMIN_GROUP_NAME: $(parameterSqlAdminGroupName)
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      python3 scripts/pipeline/infrastructure_parameters.py \
                        --component classic \
                        --environment ${{ parameters.environmentName }} \
                        --classic-environment ${{ parameters.classicEnvironmentName }} \
                        --output "$(Build.SourcesDirectory)/bicep/30-classic-runtime.bicepparam"

                - task: PublishPipelineArtifact@1
                  displayName: Publish artifact
                  inputs:
                    artifactName: ${{ parameters.stagePrefix }}bicepparam-classic
                    targetPath: $(Build.SourcesDirectory)/bicep/30-classic-runtime.bicepparam

                - task: AzureCLI@2
                  displayName: WhatIf - Classic
                  inputs:
                    azureSubscription: ${{ variables.classicServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      az deployment group what-if \
                        --name "Classic-$(Build.BuildId)" \
                        --subscription $(classicSubscriptionId) \
                        --resource-group $(classicResourceGroupName) \
                        --template-file bicep/30-classic.bicep \
                        --parameters bicep/30-classic-runtime.bicepparam \
                        --parameters tenantId="$(tenantId)"

                - task: AzureCLI@2
                  displayName: Deploy - Classic
                  condition: and(not(failed()), not(canceled()), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), and(${{ parameters.allowTaggedDeployments }}, startsWith(variables['Build.SourceBranch'], 'refs/tags/'))))
                  inputs:
                    azureSubscription: ${{ variables.classicServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      az deployment group create \
                        --name "Classic-$(Build.BuildId)" \
                        --subscription $(classicSubscriptionId) \
                        --resource-group $(classicResourceGroupName) \
                        --template-file bicep/30-classic.bicep \
                        --parameters bicep/30-classic-runtime.bicepparam \
                        --parameters tenantId="$(tenantId)"

                - task: AzureCLI@2
                  displayName: Wait for Deployment - Classic
                  condition: and(not(failed()), not(canceled()), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), and(${{ parameters.allowTaggedDeployments }}, startsWith(variables['Build.SourceBranch'], 'refs/tags/'))))
                  inputs:
                    azureSubscription: ${{ variables.classicServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      az deployment group wait \
                        --name "Classic-$(Build.BuildId)" \
                        --subscription $(classicSubscriptionId) \
                        --resource-group $(classicResourceGroupName) \
                        --created

                - task: AzureCLI@2
                  name: ClassicOutputs
                  displayName: Classic outputs
                  condition: and(not(failed()), not(canceled()), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), and(${{ parameters.allowTaggedDeployments }}, startsWith(variables['Build.SourceBranch'], 'refs/tags/'))))
                  env:
                    ADO_ORG_URL: $(System.CollectionUri)
                    ADO_PROJECT: $(System.TeamProject)
                    ADO_GROUP_NAME: ${{ parameters.environmentName }}
                    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
                    DEPLOYMENT_NAME: Classic-$(Build.BuildId)
                    RESOURCE_GROUP: $(classicResourceGroupName)
                    SUBSCRIPTION_ID: $(classicSubscriptionId)
                  inputs:
                    azureSubscription: ${{ variables.classicServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      python3 scripts/pipeline/sync-deployment-outputs.py \
                        --emit-output=classicRedisResourceId \
                        --emit-output=classicSearchServiceResourceId \
                        --emit-output=classicServiceBusNamespaceResourceId \
                        --emit-output=classicSqlServerResourceId \
                        classicRedisName=redisName \
                        classicRedisResourceId=redisResourceId \
                        classicSearchServiceSubscriptionId=searchServiceSubscriptionId \
                        classicSearchServiceResourceGroupName=searchServiceResourceGroupName \
                        classicSearchServiceName=searchServiceName \
                        classicSearchServiceManagedIdentityPrincipalId=searchServiceManagedIdentityPrincipalId \
                        classicSearchServiceManagedIdentityPrincipalName=searchServiceManagedIdentityPrincipalName \
                        classicSearchServiceResourceId=searchServiceResourceId \
                        classicServiceBusNamespaceName=serviceBusNamespaceName \
                        classicServiceBusNamespaceResourceId=serviceBusNamespaceResourceId \
                        classicSqlServerName=sqlServerName \
                        classicSqlServerResourceId=sqlServerResourceId
