# Note: For hybrid deployments to classic SND environment, we will also need variables from the DEV library
# group - these should be passed in from the parent pipeline definition, with the classicEnvironmentName parameter
# for this stage template overridden to SND. This will achieve the necessary variable precedence.
# See https://learn.microsoft.com/en-us/azure/devops/pipelines/process/variables?view=azure-devops&tabs=yaml%2Cbatch#expansion-of-variables
parameters:
  - name: environmentName
    type: string
  - name: classicEnvironmentName
    type: string

  - name: dependsOn
    type: object
    default: []
  - name: deploymentVariables
    type: object
    default: {}

stages:
  - stage: DeployClassic
    displayName: Deploy Classic
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: "${{ parameters.classicEnvironmentName }}"
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.classicEnvironmentName) }}.yaml"
      # Main pipelines supply the modern SQL admin group from access validation.
      # The fallback keeps this stage usable without an explicit output dependency.
      - name: parameterSqlAdminGroupId
        value: $(sqlAdminGroupId)
      - name: parameterSqlAdminGroupName
        value: $(sqlAdminGroupName)
      - ${{ each variable in parameters.deploymentVariables }}:
        - name: ${{ variable.key }}
          value: ${{ variable.value }}
    jobs:
      - template: ../jobs/infrastructure/deploy-bicep-classic.yaml
        parameters:
          environmentName: ${{ parameters.environmentName }}
          classicEnvironmentName: ${{ parameters.classicEnvironmentName }}
