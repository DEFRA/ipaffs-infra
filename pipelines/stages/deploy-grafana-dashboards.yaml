---
# deploy-grafana-dashboards.yaml
#
# Deploys Grafana dashboard JSON files to ONE environment's own Azure Managed
# Grafana instance, using that env's service connection so dashboards land in
# the correct subscription. Included once per environment, in whatever order
# the parent pipeline's "environments" list parameter defines, so every
# environment ends up on the same dashboard version.
#
# Dashboard directory layout:
#   dashboards/*.json -> all deployed to every environment
# (Per-env dashboards are not supported yet.)
#
# Each dashboard's template variables (the namespace / datasource dropdowns) are
# stored inside its JSON and travel with it. Each env's Grafana holds its own
# Prometheus and Azure Monitor datasources (created by the ConfigureGrafana
# stage as "Prometheus" / "Azure Monitor"). At deploy time we
# point the dashboard's datasource template variables at this env's datasources
# (by resolved UID) in-memory; the repo source file is never modified.
#
# Branch gating:
#   By default this env deploys only when the pipeline runs on 'main'.
#   allowBranchDeploy lets it deploy from the branch you queued on (for
#   testing). The parent pipeline only ever sets this for the first
#   environment in its list - this template has no notion of which
#   environment name is "first".
#
# Approval:
#   There is a single manual approval gate after the first environment (see
#   approve-grafana-gate.yaml), not one per environment. When this stage
#   follows that gate, pass gateStageName so the stage still runs (in preview
#   mode) even if the gate was Skipped (non-main builds).

parameters:
  - name: targetEnvironment
    type: string   # single env, e.g. DEV

  - name: allowBranchDeploy
    type: boolean  # true => this env deploys from the current branch (not just main)
    default: false

  - name: gateStageName
    type: string   # name of a preceding approval-gate stage whose 'Skipped' result should still let this stage run; '' = default dependency behaviour
    default: ''

  - name: serviceConnections
    type: object   # env -> service connection name; azureSubscription needs a compile-time literal (see comment below), so this must mirror serviceConnection in pipelines/vars/<env>.yaml
    default:
      DEV: ADO-DefraGovUK-AZR-IMP-DEV1
      TST: ADO-DefraGovUK-AZR-IMP-TST1
      PRE: ADO-DefraGovUK-AZR-IMP-PRE1
      PRD: ADO-DefraGovUK-AZR-IMP-PRD1

stages:
  - stage: DeployGrafanaDashboards_${{ parameters.targetEnvironment }}
    displayName: Deploy Dashboards -> ${{ parameters.targetEnvironment }} Grafana
    ${{ if ne(parameters.gateStageName, '') }}:
      dependsOn: ${{ parameters.gateStageName }}
      # Proceed when the gate Succeeded, or when it was Skipped (non-main
      # builds, where the deploy tasks are gated off and only preview runs).
      condition: in(dependencies.${{ parameters.gateStageName }}.result, 'Succeeded', 'Skipped')
    variables:
      - group: Common
      - group: "${{ parameters.targetEnvironment }}"
      - template: /pipelines/vars/${{ lower(parameters.targetEnvironment) }}.yaml

    jobs:
      - deployment: Deploy_${{ parameters.targetEnvironment }}
        displayName: Deploy dashboards to ${{ parameters.targetEnvironment }} Grafana
        environment:
          name: "${{ parameters.targetEnvironment }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Install Azure Managed Grafana CLI extension
                  inputs:
                    # A literal, not $(serviceConnection): ADO's pre-run resource-
                    # authorization check can't resolve a stage-scoped macro when
                    # each of the 4 stages in this run binds it to a different value.
                    azureSubscription: ${{ parameters.serviceConnections[parameters.targetEnvironment] }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # SC may default to a different subscription; pin this env's first
                      az account set --subscription "$(subscriptionId)"
                      az account show --query id -o tsv   # fail-fast: prove the sub
                      az extension add --name amg --yes --upgrade --only-show-errors

                - task: Bash@3
                  displayName: Preview dashboards to deploy (${{ parameters.targetEnvironment }})
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail

                      echo "=== Dashboards to deploy ==="
                      find grafana-dashboards/dashboards -name "*.json" 2>/dev/null \
                        | while read -r f; do
                            uid=$(jq -r '.uid' "${f}")
                            echo "  ${f}  uid=${uid}  datasources: Prometheus / Azure Monitor"
                          done

                - task: AzureCLI@2
                  displayName: Deploy dashboards to ${{ parameters.targetEnvironment }} Grafana
                  # This env may deploy from any branch when allowBranchDeploy is set;
                  # otherwise it deploys only on main.
                  ${{ if eq(parameters.allowBranchDeploy, true) }}:
                    condition: and(not(failed()), not(canceled()))
                  ${{ else }}:
                    condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                  inputs:
                    # A literal, not $(serviceConnection): ADO's pre-run resource-
                    # authorization check can't resolve a stage-scoped macro when
                    # each of the 4 stages in this run binds it to a different value.
                    azureSubscription: ${{ parameters.serviceConnections[parameters.targetEnvironment] }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # SC may default to a different subscription; pin this env's first
                      az account set --subscription "$(subscriptionId)"
                      az account show --query id -o tsv   # fail-fast: prove the sub
                      # Single source of truth for the deploy + datasource-injection
                      # logic; the same script can be run locally to test a dashboard.
                      GRAFANA_NAME="$(grafanaName)" \
                      RESOURCE_GROUP="$(resourceGroupName)" \
                      ENVIRONMENT="${{ parameters.targetEnvironment }}" \
                      bash grafana-dashboards/scripts/deploy-dashboards.sh

                - task: AzureCLI@2
                  displayName: Verify deployed dashboards (${{ parameters.targetEnvironment }})
                  # Verify runs whenever the deploy ran (same gate).
                  ${{ if eq(parameters.allowBranchDeploy, true) }}:
                    condition: and(not(failed()), not(canceled()))
                  ${{ else }}:
                    condition: and(not(failed()), not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
                  inputs:
                    # A literal, not $(serviceConnection): ADO's pre-run resource-
                    # authorization check can't resolve a stage-scoped macro when
                    # each of the 4 stages in this run binds it to a different value.
                    azureSubscription: ${{ parameters.serviceConnections[parameters.targetEnvironment] }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      # SC may default to a different subscription; pin this env's first.
                      az account set --subscription "$(subscriptionId)"
                      az account show --query id -o tsv   # fail-fast: prove the sub
                      GRAFANA_NAME="$(grafanaName)"
                      RESOURCE_GROUP="$(resourceGroupName)"
                      ERRORS=0

                      check_file() {
                        local f="$1"
                        local uid title
                        uid=$(jq -r '.uid' "${f}")
                        title=$(jq -r '.title' "${f}")

                        if az grafana dashboard show \
                             --name "${GRAFANA_NAME}" \
                             --resource-group "${RESOURCE_GROUP}" \
                             --dashboard "${uid}" \
                             --output none 2>/dev/null; then
                          echo "  OK ${title} (uid=${uid})"
                        else
                          echo "  NOT FOUND: ${title} (uid=${uid})" >&2
                          ERRORS=$((ERRORS + 1))
                        fi
                      }

                      find grafana-dashboards/dashboards -name "*.json" 2>/dev/null \
                        | while read -r f; do check_file "${f}"; done

                      if [[ "${ERRORS}" -gt 0 ]]; then exit 1; fi
                      echo "All dashboards verified."

# vim: set ts=2 sts=2 sw=2 et:
