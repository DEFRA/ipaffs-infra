parameters:
  - name: stagePrefix
    type: string
    default: ''

  - name: allowTaggedDeployments
    type: boolean
    default: false

  - name: environmentName
    type: string

  - name: dependsOn
    type: object
    default: []
  - name: deploymentVariables
    type: object
    default: {}

stages:
  - stage: ${{ parameters.stagePrefix }}DeployResourceGroup
    displayName: Deploy Resource Group
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
      - ${{ each variable in parameters.deploymentVariables }}:
        - name: ${{ variable.key }}
          value: ${{ variable.value }}
    jobs:
      - deployment: RunBicep
        displayName: Run Bicep
        environment:
          name: "${{ parameters.environmentName }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self

                - task: Bash@3
                  name: GenerateBicepParams
                  displayName: Generate Bicep Params
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      python3 scripts/pipeline/infrastructure_parameters.py \
                        --component resource-group \
                        --environment ${{ parameters.environmentName }} \
                        --output "$(Build.SourcesDirectory)/bicep/10-resource-group-runtime.bicepparam"

                - task: PublishPipelineArtifact@1
                  displayName: Publish artifact
                  inputs:
                    artifactName: ${{ parameters.stagePrefix }}bicepparam-resource-group
                    targetPath: $(Build.SourcesDirectory)/bicep/10-resource-group-runtime.bicepparam

                - task: AzureCLI@2
                  displayName: WhatIf - Resource Group
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      az deployment sub what-if \
                        --name "ResourceGroup-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --location $(location) \
                        --template-file bicep/10-resource-group.bicep \
                        --parameters bicep/10-resource-group-runtime.bicepparam

                - task: AzureCLI@2
                  displayName: Deploy - ResourceGroup
                  condition: and(not(failed()), not(canceled()), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), and(${{ parameters.allowTaggedDeployments }}, startsWith(variables['Build.SourceBranch'], 'refs/tags/'))))
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -x
                      az deployment sub create \
                        --name "ResourceGroup-$(Build.BuildId)" \
                        --subscription $(subscriptionId) \
                        --location $(location) \
                        --template-file bicep/10-resource-group.bicep \
                        --parameters bicep/10-resource-group-runtime.bicepparam
