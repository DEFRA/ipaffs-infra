parameters:
  - name: stagePrefix
    type: string
    default: ''

  - name: allowTaggedDeployments
    type: boolean
    default: false

  - name: environmentName
    type: string

  - name: applyOnBranch
    type: boolean
    default: false

  - name: dependsOn
    type: object
    default: []
  - name: deploymentVariables
    type: object
    default: {}

stages:
  - stage: ${{ parameters.stagePrefix }}RunHooks
    displayName: Run Hooks
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
        - group: HigherEnvs
      - ${{ else }}:
        - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
      - ${{ each variable in parameters.deploymentVariables }}:
        - name: ${{ variable.key }}
          value: ${{ variable.value }}
    jobs:
      - deployment: Hooks
        displayName: Run deployment hooks
        environment:
          name: "${{ parameters.environmentName }}"
        # Runs on every branch; DRY_RUN decides whether hooks may change anything.
        condition: and(not(failed()), not(canceled()))
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  name: RunHooks
                  displayName: Run hooks in scripts/hooks
                  env:
                    ENVIRONMENT: ${{ lower(parameters.environmentName) }}
                    HOOKS_DIR: scripts/hooks
                    SUBSCRIPTION_ID: $(subscriptionId)
                    RESOURCE_GROUP_NAME: $(resourceGroupName)
                    ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(parameters.applyOnBranch, true), and(eq(parameters.allowTaggedDeployments, true), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))) }}:
                      DRY_RUN: "false"
                    ${{ else }}:
                      DRY_RUN: "true"
                  inputs:
                    azureSubscription: ${{ variables.serviceConnection }}
                    scriptType: bash
                    scriptPath: scripts/pipeline/run-hooks.sh
