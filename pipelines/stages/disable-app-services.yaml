---
# Stops or starts the App Services listed for one environment
# With requireApproval the stage waits for a manual approval in this pipeline
# so the gate never depends on how the ADO Environment is configured
parameters:
  - name: environmentName
    type: string

  - name: action
    type: string

  - name: requireApproval
    type: boolean

  - name: approvalTimeoutInMinutes
    type: number
    default: 1440

stages:
  - stage: AppServices${{ parameters.environmentName }}
    displayName: ${{ upper(parameters.action) }} ${{ parameters.environmentName }} App Services
    variables:
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
    jobs:
      - ${{ if parameters.requireApproval }}:
        - job: Approve
          displayName: Approve ${{ parameters.action }} in ${{ parameters.environmentName }}
          pool: server
          timeoutInMinutes: ${{ parameters.approvalTimeoutInMinutes }}
          steps:
            - task: ManualValidation@1
              displayName: Approve ${{ parameters.action }} in ${{ parameters.environmentName }}
              timeoutInMinutes: ${{ parameters.approvalTimeoutInMinutes }}
              inputs:
                notifyUsers: $(Build.RequestedForEmail)
                instructions: >-
                  Approve to ${{ parameters.action }} the App Services listed in
                  scripts/pipeline/disable-app-services/${{ lower(parameters.environmentName) }}-decommission-apps.txt
                  in ${{ parameters.environmentName }}. Reject to stop the run here.
                onTimeout: reject

        # The ADO Environment keeps its own checks on top of the approval above
        - deployment: AppServices
          displayName: ${{ parameters.action }} listed App Services
          dependsOn: Approve
          timeoutInMinutes: 60
          environment:
            name: "${{ parameters.environmentName }}"
          strategy:
            runOnce:
              deploy:
                steps:
                  - template: /pipelines/steps/disable-app-services.yaml
                    parameters:
                      environmentName: ${{ parameters.environmentName }}
                      action: ${{ parameters.action }}
                      # Resolved when the template expands because the service connection is checked before stage variables exist
                      serviceConnection: ${{ variables.classicServiceConnection }}

      - ${{ else }}:
        - job: AppServices
          displayName: ${{ parameters.action }} listed App Services
          timeoutInMinutes: 60
          steps:
            - template: /pipelines/steps/disable-app-services.yaml
              parameters:
                environmentName: ${{ parameters.environmentName }}
                action: ${{ parameters.action }}
                serviceConnection: ${{ variables.classicServiceConnection }}
