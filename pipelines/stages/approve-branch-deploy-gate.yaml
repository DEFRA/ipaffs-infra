---
# approve-branch-deploy-gate.yaml
#
# Manual approval gate before the first environment deploys, only relevant
# for a manually queued run off main (testing before merge). On main it is
# Skipped automatically and the first environment deploys immediately. On a
# PR or CI-triggered build off main it is also skipped (so PR checks never sit
# blocked on an approval) - only manually triggered pipeline waits here.

parameters:
  - name: environment
    type: string   # name of the environment this gates, shown to the approver

stages:
  - stage: ApproveBranchDeploy
    displayName: Approve deploying ${{ parameters.environment }} from this branch
    # succeeded() is spelled out since a custom condition replaces the default
    condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - job: Approve
        displayName: Approve deploy to ${{ parameters.environment }} from this branch
        pool: server
        timeoutInMinutes: 4320   # overall wait window for an approver (3 days)
        steps:
          - task: ManualValidation@0
            displayName: Wait for approval to deploy ${{ parameters.environment }} from this branch
            timeoutInMinutes: 4320
            inputs:
              instructions: "This run is not on main. Approve to deploy ${{ parameters.environment }} from this branch for testing."
              onTimeout: reject

