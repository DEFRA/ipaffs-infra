---
name: $(Date:yyyyMMdd)$(Rev:.r)
appendCommitMessageToRunName: false

trigger: none
pr: none

# Manually select an existing feature namespace. No schedule or deployment trigger.

parameters:
  - name: targetNamespace
    displayName: Feature namespace
    type: string
    default: ' '

  - name: b2bBaseUrl
    displayName: B2B frontend URL (feature proxy-int)
    type: string
    default: ' '

  - name: b2cBaseUrl
    displayName: B2C frontend URL (feature proxy)
    type: string
    default: ' '

  - name: soapBaseUrl
    displayName: SOAP base URL (feature proxy API)
    type: string
    default: ' '

  - name: openIdTokenUrl
    displayName: OpenID token URL (include /ad/sign)
    type: string
    default: ' '

  - name: bipBaseUrl
    displayName: BIP service base URL
    type: string
    default: ' '

  - name: notificationBaseUrl
    displayName: Notification service URL (include /notifications)
    type: string
    default: ' '

  - name: riskEngineBaseUrl
    displayName: Risk engine URL (optional; blank uses DEV)
    type: string
    default: ' '

  - name: workers
    displayName: Workers
    type: number
    default: 8
    values:
      - 4
      - 8
      - 12
      - 16

  - name: imageTag
    displayName: QA image tag (must support FTR URL overrides)
    type: string
    default: latest

  - name: playwrightTag
    displayName: Playwright Tag (if set overrides any Test Suite selection!)
    type: string
    default: ' '

  - name: testSuite
    displayName: Test Suite
    type: string
    default: test
    values:
      - test
      - test:a11y
      - test:cross-browser
      - test:visual
      - test:visual:update

  - name: csvReport
    displayName: Generate CSV report
    type: boolean
    default: true

  - name: notification
    displayName: Send Notification
    type: boolean
    default: false

extends:
  template: templates/qa-automation.yaml
  parameters:
    environmentName: DEV
    workers: ${{ parameters.workers }}
    imageTag: ${{ parameters.imageTag }}
    playwrightTag: ${{ parameters.playwrightTag }}
    testSuite: ${{ parameters.testSuite }}
    csvReport: ${{ parameters.csvReport }}
    notification: ${{ parameters.notification }}
    featureNamespace: true
    targetNamespace: ${{ parameters.targetNamespace }}
    b2bBaseUrl: ${{ parameters.b2bBaseUrl }}
    b2cBaseUrl: ${{ parameters.b2cBaseUrl }}
    soapBaseUrl: ${{ parameters.soapBaseUrl }}
    openIdTokenUrl: ${{ parameters.openIdTokenUrl }}
    bipBaseUrl: ${{ parameters.bipBaseUrl }}
    notificationBaseUrl: ${{ parameters.notificationBaseUrl }}
    riskEngineBaseUrl: ${{ parameters.riskEngineBaseUrl }}
