---
parameters:
  - name: environmentName
    displayName: Environment
    type: string
    default: DEV

  - name: serviceName
    type: string

  - name: dockerFile
    type: string
    default: Dockerfile

  - name: migrations
    type: boolean
    default: false

  - name: mvnGoals
    type: string
    default: verify jacoco:report package

  - name: helmfileAction
    type: string
    default: apply

  - name: updateManifest
    type: boolean
    default: true

  - name: manifestBranch
    type: string
    default: auto

  - name: manifestTrunkBranch
    type: string
    default: master

  - name: sonarAnalysis
    type: boolean
    default: false

  - name: sonarReferenceBranch
    type: string
    default: master

  - name: mavenRegistry
    displayName: Maven registry (only feed; kept so pipelines that set it still work)
    type: string
    default: feed
    values:
      - feed

stages:
  - stage: DetectContainerBuild
    displayName: Detect Container Build Requirement
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
          - group: HigherEnvs
      - ${{ else }}:
          - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

    jobs:
      - job: DetermineBuildMode
        displayName: Determine if container build is required
        steps:
          - checkout: self
            fetchDepth: 2
            path: s/self

          - task: Bash@3
            name: SetBuildMode
            displayName: Detect deployment-only values changes
            env:
              SOURCE_VERSION: $(Build.SourceVersion)
              BUILD_REASON: $(Build.Reason)
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/s/self
              script: |
                set -euo pipefail

                # A manually queued run always builds, so a base image fix can be picked up
                # even when the latest commit only changed values.yaml.
                if [[ "${BUILD_REASON:-}" == "Manual" ]]; then
                  echo "Manually queued run. Container build and package stages will run."
                  echo "##vso[task.setvariable variable=skipContainerBuild;isOutput=true]false"
                  exit 0
                fi

                head_commit="${SOURCE_VERSION:-}"
                if [[ -z "${head_commit}" ]] || ! git cat-file -e "${head_commit}^{commit}" >/dev/null 2>&1; then
                  head_commit="$(git rev-parse HEAD)"
                fi

                if git rev-parse "${head_commit}^" >/dev/null 2>&1; then
                  base_commit="$(git rev-parse "${head_commit}^")"
                else
                  base_commit="$(git hash-object -t tree /dev/null)"
                fi

                mapfile -t changed_files < <(git diff --name-only "${base_commit}" "${head_commit}" --)

                echo "Comparing changes from ${base_commit} to ${head_commit}"

                if [[ ${#changed_files[@]} -eq 0 ]]; then
                  echo "No changed files detected. Container build and package stages will run."
                  echo "##vso[task.setvariable variable=skipContainerBuild;isOutput=true]false"
                  exit 0
                fi

                printf 'Changed files:\n'
                printf ' - %s\n' "${changed_files[@]}"

                deployment_values_only=true
                for changed_file in "${changed_files[@]}"; do
                  if [[ ! "${changed_file}" =~ ^deployment(/[^/]+)?/values\.ya?ml$ ]]; then
                    deployment_values_only=false
                    break
                  fi
                done

                if [[ "${deployment_values_only}" == "true" ]]; then
                  echo "Only deployment values.yaml files changed. Skipping container build and package stages."
                  echo "##vso[task.setvariable variable=skipContainerBuild;isOutput=true]true"
                else
                  echo "Detected non-values changes. Container build and package stages will run."
                  echo "##vso[task.setvariable variable=skipContainerBuild;isOutput=true]false"
                fi

  - stage: BuildService
    displayName: Build Service
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
          - group: HigherEnvs
      - ${{ else }}:
          - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

    dependsOn: DetectContainerBuild
    condition: and(
      not(failed()), not(canceled()),
      eq(dependencies.DetectContainerBuild.result, 'Succeeded'),
      ne(dependencies.DetectContainerBuild.outputs['DetermineBuildMode.SetBuildMode.skipContainerBuild'], 'true')
      )
    jobs:
      - template: /pipelines/jobs/build-java-project.yaml@ipaffs-infra
        parameters:
          mvnGoals:  "${{ parameters.mvnGoals }}"
          mavenRegistry: "${{ parameters.mavenRegistry }}"

  - ${{ if eq(parameters.sonarAnalysis, true) }}:
    - stage: SonarAnalysis
      displayName: SonarQube Analysis
      variables:
        - group: Common
        - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
            - group: HigherEnvs
        - ${{ else }}:
            - group: LowerEnvs
        - group: "${{ parameters.environmentName }}"
        - template: "/pipelines/vars/common.yaml"
        - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

      dependsOn:
        - DetectContainerBuild
        - BuildService
      condition: and(
        not(canceled()),
        eq(dependencies.DetectContainerBuild.result, 'Succeeded'),
        ne(dependencies.DetectContainerBuild.outputs['DetermineBuildMode.SetBuildMode.skipContainerBuild'], 'true'),
        in(dependencies.BuildService.result, 'Succeeded', 'Skipped')
        )
      jobs:
        - template: /pipelines/jobs/sonar-analyse-java-project.yaml@ipaffs-infra
          parameters:
            referenceBranch: "${{ parameters.sonarReferenceBranch }}"

  - stage: PackageService
    displayName: Package Service Image
    variables:
      - group: Common
      - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
          - group: HigherEnvs
      - ${{ else }}:
          - group: LowerEnvs
      - group: "${{ parameters.environmentName }}"
      - template: "/pipelines/vars/common.yaml"
      - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

    dependsOn:
      - DetectContainerBuild
      - BuildService
    condition: and(
      not(failed()), not(canceled()),
      eq(dependencies.DetectContainerBuild.result, 'Succeeded'),
      ne(dependencies.DetectContainerBuild.outputs['DetermineBuildMode.SetBuildMode.skipContainerBuild'], 'true'),
      eq(dependencies.BuildService.result, 'Succeeded')
      )
    jobs:
      - template: /pipelines/jobs/package-java-project.yaml@ipaffs-infra
        parameters:
          useAcrBaseImage: ${{ eq(parameters.environmentName, 'DEV') }}
          migrations: ${{ parameters.migrations }}
          serviceName:  "${{ parameters.serviceName }}"
          dockerFile: "${{ parameters.dockerFile }}"

  - ${{ if eq(parameters.updateManifest, true) }}:
    - stage: UpdateManifest
      displayName: Update ipaffs-manifest
      lockBehavior: sequential

      dependsOn:
        - DetectContainerBuild
        - PackageService
      variables:
        - group: Common
        - ${{ if or(eq(parameters.environmentName, 'PRD'), eq(parameters.environmentName, 'PRE')) }}:
            - group: HigherEnvs
        - ${{ else }}:
            - group: LowerEnvs
        - group: "${{ parameters.environmentName }}"
        - template: "/pipelines/vars/common.yaml"
        - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"
        - name: skipContainerBuild
          value: $[ stageDependencies.DetectContainerBuild.DetermineBuildMode.outputs['SetBuildMode.skipContainerBuild'] ]
      condition: and(
        not(failed()), not(canceled()),
        eq(dependencies.DetectContainerBuild.result, 'Succeeded'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/'),
        or(
          eq(dependencies.DetectContainerBuild.outputs['DetermineBuildMode.SetBuildMode.skipContainerBuild'], 'true'),
          eq(dependencies.PackageService.result, 'Succeeded')
          )
        )
      jobs:
        - template: /pipelines/jobs/update-manifest.yaml@ipaffs-infra
          parameters:
            serviceName: "${{ parameters.serviceName }}"
            serviceRuntime: java
            manifestBranch: "${{ parameters.manifestBranch }}"
            manifestTrunkBranch: "${{ parameters.manifestTrunkBranch }}"
