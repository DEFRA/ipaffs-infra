---
# Shared execution and reporting for DEV, TST and manual FTR QA entry points.
parameters:
  - name: environmentName
    displayName: Environment
    type: string
    default: DEV
    values:
      - DEV
      - TST

  - name: workers
    displayName: Workers
    type: number
    default: 8
    values:
      - 4
      - 8
      - 12
      - 16

  - name: imageTag
    displayName: Image Tag
    type: string
    default: latest

  - name: playwrightTag
    displayName: Playwright Tag (if set overrides any Test Suite selection!)
    type: string
    default: ' '

  - name: testSuite
    displayName: Test Suite
    type: string
    default: test
    values:
      - test
      - test:a11y
      - test:cross-browser
      - test:visual
      - test:visual:update

  - name: csvReport
    displayName: Generate CSV report
    type: boolean
    default: true

  - name: notification
    displayName: Send Notification
    type: boolean
    default: false

  # FTR reuses DEV credentials and configuration, with explicit namespace endpoints.
  - name: featureNamespace
    type: boolean
    default: false

  - name: targetNamespace
    type: string
    default: ''

  - name: b2bBaseUrl
    type: string
    default: ''

  - name: b2cBaseUrl
    type: string
    default: ''

  - name: soapBaseUrl
    type: string
    default: ''

  - name: openIdTokenUrl
    type: string
    default: ''

  - name: bipBaseUrl
    type: string
    default: ''

  - name: notificationBaseUrl
    type: string
    default: ''

  - name: riskEngineBaseUrl
    type: string
    default: ''

variables:
  - group: Common
  - template: "/pipelines/vars/common.yaml"

  - group: Testing

  - group: LowerEnvs
  - group: "${{ parameters.environmentName }}"
  - template: "/pipelines/vars/${{ lower(parameters.environmentName) }}.yaml"

  # DEV deployment triggers use smoke tests; scheduled/manual runs retain their selection.
  - name: requestedPlaywrightTag
    value: ${{ parameters.playwrightTag }}
  - name: effectivePlaywrightTag
    ${{ if eq(parameters.environmentName, 'DEV') }}:
      value: $[iif(and(eq(variables['Build.Reason'], 'ResourceTrigger'), eq(variables['Resources.TriggeringAlias'], 'deployment')), '@smoke', variables['requestedPlaywrightTag'])]
    ${{ else }}:
      value: ${{ parameters.playwrightTag }}

resources:
  repositories:
    - repository: ipaffs-qa-automation
      type: github
      endpoint: DEFRA
      name: DEFRA/ipaffs-qa-automation
      ref: refs/heads/main

stages:
  - stage: RunTests
    displayName: Run QA Automation Test Suite
    pool:
      name: DEFRA-COMMON-ubuntu2204-SSV5
    jobs:
      - job: RunAndPublishTests
        ${{ if eq(parameters.featureNamespace, true) }}:
          displayName: Playwright tests - FTR ${{ parameters.targetNamespace }}
        ${{ else }}:
          displayName: Playwright tests - $(resources.pipeline.deployment.runName)
        timeoutInMinutes: 180
        steps:
          - checkout: self
            path: s/ipaffs-infra

          - checkout: ipaffs-qa-automation
            path: s/ipaffs-qa-automation
            clean: true

          - task: Bash@3
            displayName: Name QA run and record context
            env:
              ${{ if eq(parameters.featureNamespace, true) }}:
                QA_DEPLOYMENT_NAME: FTR-${{ parameters.targetNamespace }}
              ${{ else }}:
                QA_DEPLOYMENT_NAME: $(resources.pipeline.deployment.runName)
              QA_RUN_NUMBER: $(Build.BuildNumber)
              QA_ENVIRONMENT: ${{ parameters.environmentName }}
              QA_FEATURE_NAMESPACE: ${{ parameters.featureNamespace }}
              QA_TARGET_NAMESPACE: ${{ parameters.targetNamespace }}
              B2B_BASE_URL: ${{ parameters.b2bBaseUrl }}
              B2C_BASE_URL: ${{ parameters.b2cBaseUrl }}
              SOAP_BASE_URL: ${{ parameters.soapBaseUrl }}
              OPEN_ID_TOKEN_URL: ${{ parameters.openIdTokenUrl }}
              BIP_BASE_URL: ${{ parameters.bipBaseUrl }}
              NOTIFICATION_BASE_URL: ${{ parameters.notificationBaseUrl }}
              RISK_ENGINE_BASE_URL: ${{ parameters.riskEngineBaseUrl }}
              QA_TEST_SUITE: ${{ parameters.testSuite }}
              QA_TEST_FILTER: $(effectivePlaywrightTag)
              QA_IMAGE_TAG: ${{ parameters.imageTag }}
              QA_RUN_ID: $(Build.BuildId)
              QA_PIPELINE_ID: $(System.DefinitionId)
              QA_BUILD_REASON: $(Build.Reason)
              QA_TRIGGER_ALIAS: $(Resources.TriggeringAlias)
              QA_DEPLOYMENT_RUN_ID: $(resources.pipeline.deployment.runID)
              QA_DEPLOYMENT_PIPELINE_ID: $(resources.pipeline.deployment.pipelineID)
              QA_DEPLOYMENT_SOURCE_REF: $(resources.pipeline.deployment.sourceBranch)
              QA_DEPLOYMENT_SOURCE_COMMIT: $(resources.pipeline.deployment.sourceCommit)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                python3 "$(Pipeline.Workspace)/s/ipaffs-infra/scripts/pipeline/prepare-qa-target.py" "$(Pipeline.Workspace)/s/ipaffs-qa-automation/.env-target"
                filter="${QA_TEST_FILTER//[@ ]/}"
                name="$(printf '%s' "${QA_DEPLOYMENT_NAME}${filter:+-$filter}" | tr -cs 'A-Za-z0-9._-' '-')"
                echo "##vso[build.updatebuildnumber]${name:0:200}-${QA_RUN_NUMBER##*-}"
                python3 "$(Pipeline.Workspace)/s/ipaffs-infra/scripts/pipeline/write-qa-run-context.py" "$(Build.ArtifactStagingDirectory)/qa-run-context/run.json"

          - task: AzureCLI@2
            displayName: Update QA Automation environment file
            inputs:
              azureSubscription: $(qaAutomationServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/s/ipaffs-qa-automation
              inlineScript: |
                $(Pipeline.Workspace)/s/ipaffs-infra/scripts/pipeline/substitute-environment-variables.sh .env-kv $(qaAutomationKeyvaultName) .env-substituted

          - task: AzureCLI@2
            displayName: Log AKS Service Status
            continueOnError: true
            env:
              AKS_NAME: $(kubernetesCluster)
              AKS_RESOURCE_GROUP_NAME: $(resourceGroupName)
              AKS_SUBSCRIPTION_NAME: $(subscriptionName)
              TARGET_NAMESPACE: $(qaTargetNamespace)
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -x
                K8S_ENV="${TARGET_NAMESPACE}"
                az aks install-cli --client-version v1.36.1 --kubelogin-version v0.2.18
                az aks get-credentials \
                  --name "${AKS_NAME}" \
                  --resource-group "${AKS_RESOURCE_GROUP_NAME}" \
                  --subscription "${AKS_SUBSCRIPTION_NAME}" \
                  --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli
                kubectl get deployments,cronjobs,scaledjobs -n "${K8S_ENV}" -L defra.gov.uk/manifest-tag
                echo "--- Recent warnings ---"
                kubectl get events -n "${K8S_ENV}" --field-selector type=Warning --sort-by=.lastTimestamp 2>/dev/null | tail -20

          - task: AzureCLI@2
            displayName: Run Automation Container
            env:
              WORKERS: ${{ parameters.workers }}
              IMAGE_TAG: ${{ parameters.imageTag }}
              PLAYWRIGHT_TAG: $(effectivePlaywrightTag)
              TEST_SUITE: ${{ parameters.testSuite }}
              QA_AUTOMATION_ENV: ${{ lower(parameters.environmentName) }}
              QA_FEATURE_NAMESPACE: ${{ parameters.featureNamespace }}
            inputs:
              azureSubscription: $(qaAutomationServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/s/ipaffs-qa-automation
              inlineScript: |
                set -euo pipefail
                DOCKER_RUN=(docker run --init --rm
                  --volume "${PWD}/playwright-report:/app/playwright-report:rw"
                  --volume "${PWD}/test-results:/app/test-results:rw"
                  --env-file .env-substituted --env-file .env-target
                  "$(acrLoginServer)/ipaffs/qa-automation:${IMAGE_TAG}")
                echo "Executing QA automation framework for environment ${QA_AUTOMATION_ENV}"

                mkdir -p playwright-report test-results
                az acr login --name "$(qaAutomationAcrName)" --subscription "$(qaAutomationSubscriptionName)"
                docker pull "$(qaAutomationAcrName).azurecr.io/ipaffs/qa-automation:${IMAGE_TAG}"

                # Old images do not understand endpoint overrides. Fail before running tests.
                if [[ "${QA_FEATURE_NAMESPACE,,}" == "true" ]]; then
                  "${DOCKER_RUN[@]}" npm run config:validate
                fi

                if [[ -n "${PLAYWRIGHT_TAG// /}" ]]; then
                  "${DOCKER_RUN[@]}" npm test -- --grep "${PLAYWRIGHT_TAG}" --workers="${WORKERS}"
                else
                  case "${TEST_SUITE}" in
                    "test")
                      "${DOCKER_RUN[@]}" npm test -- --workers="${WORKERS}"
                      ;;
                    "test:a11y")
                      "${DOCKER_RUN[@]}" npm run test:a11y -- --workers="${WORKERS}"
                      ;;
                    "test:visual")
                      "${DOCKER_RUN[@]}" npm run test:visual -- --workers="${WORKERS}"
                      ;;
                    "test:visual:update")
                      "${DOCKER_RUN[@]}" npm run test:visual:update -- --workers="${WORKERS}"
                      ;;
                    "test:cross-browser")
                      "${DOCKER_RUN[@]}" npm run test:browserstack -- --workers="${WORKERS}"
                      ;;
                    *)
                      echo "Unknown test suite tag: ${TEST_SUITE}" >&2
                      exit 1
                      ;;
                  esac
                fi

          - task: AzureCLI@2
            displayName: Generate CSV Report
            env:
              IMAGE_TAG: ${{ parameters.imageTag }}
              QA_AUTOMATION_ENV: ${{ lower(parameters.environmentName) }}
              QA_FEATURE_NAMESPACE: ${{ parameters.featureNamespace }}
            inputs:
              azureSubscription: $(qaAutomationServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/s/ipaffs-qa-automation
              inlineScript: |
                set -euo pipefail
                DOCKER_RUN=(docker run --init --rm
                  --volume "${PWD}/playwright-report:/app/playwright-report:rw"
                  --volume "${PWD}/test-results:/app/test-results:rw"
                  --env-file .env-substituted --env-file .env-target
                  "$(acrLoginServer)/ipaffs/qa-automation:${IMAGE_TAG}")
                "${DOCKER_RUN[@]}" npm run report:release-csv
            condition: and(succeededOrFailed(), eq('${{ parameters.csvReport }}', true))

          - task: PublishPipelineArtifact@1
            displayName: Publish QA run context
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/qa-run-context
              artifact: qa-run-context
              publishLocation: pipeline
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: Publish Playwright Report Artifact
            inputs:
              targetPath: $(Pipeline.Workspace)/s/ipaffs-qa-automation/playwright-report
              artifact: playwright-report-$(Build.BuildNumber)
              publishLocation: 'pipeline'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: Publish Test Results Artifact
            inputs:
              targetPath: $(Pipeline.Workspace)/s/ipaffs-qa-automation/test-results
              artifact: test-results-$(Build.BuildNumber)
              publishLocation: 'pipeline'
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: Publish Test results
            inputs:
              searchFolder: $(Pipeline.Workspace)/s/ipaffs-qa-automation/test-results
              testResultsFormat: JUnit
              testResultsFiles: junit.xml
              mergeTestResults: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              failTaskOnFailureToPublishResults: true
              testRunTitle: Playwright Tests $(Build.BuildNumber)
            condition: succeededOrFailed()

          - task: AzureCLI@2
            displayName: Send notification
            env:
              SLACK_QA_CHANNEL_WEBHOOK_URL: $(slackQAChannelWebhookUrl)
              PLAYWRIGHT_DASHBOARD: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=ms.vss-test-web.build-test-results-tab
              ${{ if eq(parameters.featureNamespace, true) }}:
                K8S_ENVIRONMENT: FTR / ${{ parameters.targetNamespace }}
              ${{ else }}:
                K8S_ENVIRONMENT: ${{ parameters.environmentName }}
              QA_TEST_SUITE: ${{ parameters.testSuite }}
              QA_TEST_FILTER: $(effectivePlaywrightTag)
            inputs:
              azureSubscription: $(qaAutomationServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/s/ipaffs-qa-automation
              inlineScript: |
                $(Pipeline.Workspace)/s/ipaffs-infra/scripts/pipeline/parse-playwright-results.sh $(Pipeline.Workspace)/s/ipaffs-qa-automation/test-results/results.json "${PLAYWRIGHT_DASHBOARD}" "${K8S_ENVIRONMENT}" "${QA_TEST_SUITE}" "${QA_TEST_FILTER}"
                MESSAGE=$(<slack_payload.json)

                curl -X POST -H 'Content-type: application/json' --data "${MESSAGE}" "${SLACK_QA_CHANNEL_WEBHOOK_URL}"
            condition: eq('${{ parameters.notification }}', true)
