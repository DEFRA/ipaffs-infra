name: Pipeline syntax

on:
  pull_request:
    paths:
      - ".github/workflows/pipeline-syntax.yaml"
      - "release-pipeline.yaml"
      - "release-refs-pipeline.yaml"
      - "pipelines/*.yaml"
      - "pipelines/*.yml"
      - "pipelines/**/*.yaml"
      - "pipelines/**/*.yml"
      - "scripts/**/*.sh"
      - "scripts/**/*.test.py"
      - "scripts/pipeline/validate-access-contract.py"
      - "scripts/pipeline/decommission-classic.py"
      - "scripts/pipeline/decommission-classic/lists/*.txt"
      - "scripts/pipeline/create-release-refs.py"
      - "scripts/pipeline/sync-deployment-outputs.py"
      - "scripts/pipeline/infrastructure_*.py"
      - "scripts/pipeline/plan-infrastructure.py"
      - "bicep/*.bicep"
      - "bicep/*.bicepparam"
      - "bicep/**/*.bicep"
      - "bicep/**/*.bicepparam"
      - "bicep/bicepconfig.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipeline-syntax.yaml"
      - "release-pipeline.yaml"
      - "release-refs-pipeline.yaml"
      - "pipelines/*.yaml"
      - "pipelines/*.yml"
      - "pipelines/**/*.yaml"
      - "pipelines/**/*.yml"
      - "scripts/**/*.sh"
      - "scripts/**/*.test.py"
      - "scripts/pipeline/validate-access-contract.py"
      - "scripts/pipeline/decommission-classic.py"
      - "scripts/pipeline/decommission-classic/lists/*.txt"
      - "scripts/pipeline/create-release-refs.py"
      - "scripts/pipeline/sync-deployment-outputs.py"
      - "scripts/pipeline/infrastructure_*.py"
      - "scripts/pipeline/plan-infrastructure.py"
      - "bicep/*.bicep"
      - "bicep/*.bicepparam"
      - "bicep/**/*.bicep"
      - "bicep/**/*.bicepparam"
      - "bicep/bicepconfig.json"

jobs:
  ado-pipeline-yaml:
    name: ADO pipeline YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse pipeline YAML
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "release-pipeline.yaml" "release-refs-pipeline.yaml" "pipelines/*.yaml" "pipelines/*.yml" "pipelines/**/*.yaml" "pipelines/**/*.yml" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Azure DevOps pipeline YAML files found."
            exit 0
          fi

          ruby -e 'require "psych"; ARGV.each { |file| Psych.load_file(file); puts "Parsed #{file}" }' "${files[@]}"

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "scripts/**/*.sh" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking ${file}"
            bash -n "${file}"
          done

      - name: Test managed identity reconciliation
        shell: bash
        run: bash scripts/pipeline/create-identity.test.sh

      - name: Test generated manifest service values
        shell: bash
        run: bash scripts/pipeline/update-manifest-service-values.test.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test operations access-group contract
        run: python scripts/pipeline/validate-access-contract.test.py

      - name: Test Classic resource decommissioning
        run: python scripts/pipeline/decommission-classic.test.py

      - name: Test manifest infra pin retirement
        shell: bash
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/pipeline/update-manifest-infra-ref.test.py

      - name: Test deployment output synchronisation
        run: python scripts/pipeline/sync-deployment-outputs.test.py

      - name: Test consolidated Bicep jobs
        run: python scripts/pipeline/consolidated-bicep-jobs.test.py

      - name: Test infrastructure release promotion
        run: python scripts/pipeline/release-pipeline.test.py

      - name: Test infrastructure release refs
        run: python scripts/pipeline/release-refs.test.py

      - name: Test infrastructure previews
        run: |
          python scripts/pipeline/infrastructure-plan-report.test.py
          python scripts/pipeline/infrastructure-plan-readability.test.py
          python scripts/pipeline/infrastructure-preview-pipeline.test.py
          python scripts/pipeline/plan-infrastructure.test.py
  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    env:
      AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and verify pinned Bicep compiler
        shell: bash
        run: |
          set -euo pipefail
          export AZURE_CONFIG_DIR="${RUNNER_TEMP}/azure"
          bash scripts/pipeline/ensure-bicep-version.sh
          printf 'AZURE_CONFIG_DIR=%s\n' "$AZURE_CONFIG_DIR" >> "$GITHUB_ENV"

      - name: Build Bicep files
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "bicep/*.bicep" "bicep/**/*.bicep" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Bicep files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Building ${file}"
            az bicep build --file "${file}" --stdout > /dev/null
          done

      - name: Build Bicep parameter files
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "bicep/*.bicepparam" "bicep/**/*.bicepparam" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Bicep parameter files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Building ${file}"
            az bicep build-params --file "${file}" --stdout > /dev/null
          done
