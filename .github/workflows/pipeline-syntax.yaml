name: Pipeline syntax

on:
  pull_request:
    paths:
      - ".github/workflows/pipeline-syntax.yaml"
      - "pipelines/*.yaml"
      - "pipelines/*.yml"
      - "pipelines/**/*.yaml"
      - "pipelines/**/*.yml"
      - "scripts/**/*.sh"
      - "bicep/*.bicep"
      - "bicep/*.bicepparam"
      - "bicep/**/*.bicep"
      - "bicep/**/*.bicepparam"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipeline-syntax.yaml"
      - "pipelines/*.yaml"
      - "pipelines/*.yml"
      - "pipelines/**/*.yaml"
      - "pipelines/**/*.yml"
      - "scripts/**/*.sh"
      - "bicep/*.bicep"
      - "bicep/*.bicepparam"
      - "bicep/**/*.bicep"
      - "bicep/**/*.bicepparam"

jobs:
  ado-pipeline-yaml:
    name: ADO pipeline YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse pipeline YAML
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "pipelines/*.yaml" "pipelines/*.yml" "pipelines/**/*.yaml" "pipelines/**/*.yml" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Azure DevOps pipeline YAML files found."
            exit 0
          fi

          ruby -e 'require "psych"; ARGV.each { |file| Psych.load_file(file); puts "Parsed #{file}" }' "${files[@]}"

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Entra group membership reconciliation
        shell: bash
        run: bash scripts/pipeline/add-entra-group-members.test.sh

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "scripts/**/*.sh" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking ${file}"
            bash -n "${file}"
          done

      - name: Test managed identity reconciliation
        shell: bash
        run: bash scripts/pipeline/create-identity.test.sh

      - name: Test generated manifest service values
        shell: bash
        run: bash scripts/pipeline/update-manifest-service-values.test.sh
  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Bicep files
        shell: bash
        run: |
          set -euo pipefail

          export AZURE_CONFIG_DIR="${RUNNER_TEMP}/azure"

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "bicep/*.bicep" "bicep/**/*.bicep" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Bicep files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Building ${file}"
            az bicep build --file "${file}" --stdout --only-show-errors > /dev/null
          done

      - name: Build Bicep parameter files
        shell: bash
        run: |
          set -euo pipefail

          export AZURE_CONFIG_DIR="${RUNNER_TEMP}/azure"

          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(git ls-files "bicep/*.bicepparam" "bicep/**/*.bicepparam" | sort)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Bicep parameter files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Building ${file}"
            az bicep build-params --file "${file}" --stdout --only-show-errors > /dev/null
          done
